<script>
/* ===== helpers for sims ===== */
const ADC=v=>Math.max(0,Math.min(1023,Math.round(v/5*1023)));
const f=(x,d=2)=>isFinite(x)?Number(x).toFixed(d):'–';
const fi=(x,d=2)=>isFinite(x)?Number(x).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d}):'–';
const cl=(x,a,b)=>Math.min(b,Math.max(a,x));
const hex=(n,w=2)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
const bin=(n,w)=>(n>>>0).toString(2).padStart(w,'0');
function sineWave(off,amp,cyc=2,n=200,ph=0){const y=[];for(let i=0;i<n;i++)y.push(off+amp*Math.sin(2*Math.PI*cyc*i/n+ph));return y}
function pulseTrain(freq,duty,tEnd,start=0){const e=[[0,0]];if(freq<=0)return e;const T=1/freq;for(let t=start;t<tEnd;t+=T){e.push([t,1]);e.push([t+T*duty,0])}return e}
function bitsWave(bits,bitT,lead){const e=[[0,1]];let t=lead||0;bits.forEach(b=>{e.push([t,b]);t+=bitT});e.push([t,1]);return{e,t}}

const SENSORS=[
/* ================= ANALOG ================= */
{id:'potensiometer',nama:'Potensiometer',sub:'Pembagi tegangan putar (B1K–B100K)',cat:'analog',iface:'Analog',besaran:'Posisi sudut',
 stok:{ada:true,info:'B10K (E-298, 75 pcs, kotak 35), B1K (E-160, kotak 34), B50K (E-158, kotak 34), 5K & 100K (kotak 34)'},
 spec:[['Tegangan','5 V (ikut Vcc)'],['Nilai','1 kΩ – 100 kΩ, linear (B)'],['Output','0 – 5 V ∝ posisi wiper'],['Resolusi Uno','1024 langkah (10 bit), ±4,9 mV'],['Arus','I = 5/R (10k → 0,5 mA)']],
 prinsip:`<p>Potensiometer adalah resistor dengan kontak geser (<i>wiper</i>). Ujung-ujungnya dihubungkan ke 5 V dan GND, sehingga wiper menghasilkan tegangan <b>V = 5·(posisi/100%)</b>. Ini adalah "sensor" paling sederhana dan cocok untuk memahami ADC: ADC 10-bit Arduino Uno memetakan 0–5 V menjadi 0–1023.</p><p>Tipe <b>B</b> = linear, tipe <b>A</b> = logaritmik (untuk volume audio). Nilai 10 kΩ adalah kompromi yang baik: arus kecil, tetapi impedansinya cukup rendah untuk ADC (datasheet ATmega328P merekomendasikan impedansi sumber ≤ 10 kΩ).</p>`,
 w:{mod:'Potensiometer',sub:'pin 1 · wiper · pin 3',pins:[['Pin 1','5V'],['Wiper','A0'],['Pin 3','GND']]},
 lib:'',
 code:`// Potensiometer: pin1 -> 5V, wiper -> A0, pin3 -> GND
const int PIN_POT = A0;

void setup() {
  Serial.begin(9600);
}

void loop() {
  int adc = analogRead(PIN_POT);            // 0..1023
  float v = adc * 5.0 / 1023.0;             // tegangan wiper (volt)
  int persen = map(adc, 0, 1023, 0, 100);   // posisi 0..100 %
  Serial.print("ADC=");      Serial.print(adc);
  Serial.print("  V=");      Serial.print(v, 2);
  Serial.print(" V  Posisi="); Serial.print(persen);
  Serial.println(" %");
  delay(200);
}`,
 rumus:`<p><b>V = ADC × 5,0 / 1023</b> dan <b>posisi (%) = ADC/1023 × 100</b>.</p><p>Jika Vcc USB hanya 4,8 V, hasil tegangan ikut bergeser karena V<sub>ref</sub> = Vcc. Untuk pengukuran posisi (rasio) ini tidak masalah, karena wiper juga diberi tegangan dari Vcc yang sama (pengukuran <i>ratiometric</i>).</p>`,
 masalah:['Nilai meloncat-loncat: kontak wiper kotor/aus. Tambah kapasitor 100 nF dari wiper ke GND dan rata-ratakan beberapa sampel.','Nilai maksimum tidak sampai 1023: tegangan 5 V turun (beban USB). Ukur dengan multimeter.','Arah terbalik: tukar kabel pin 1 dan pin 3.'],
 tugas:['Kendalikan kecerahan LED (PWM D9) dengan potensiometer memakai map() ke 0–255.','Ukur linearitas: catat ADC pada 10 posisi bersudut tetap, lalu hitung error terhadap garis lurus.','Bandingkan noise ADC tanpa dan dengan kapasitor 100 nF (ambil 100 sampel, hitung simpangan baku).'],
 sim:{in:[{k:'pos',l:'Posisi wiper',min:0,max:100,step:1,u:'%',def:50}],
  out:(s,nz)=>{const v=5*s.pos/100+nz(0.004);const a=ADC(v);return{rows:[['Tegangan wiper',fi(v,3)+' V'],['ADC (A0)',a],['Posisi terbaca',Math.round(a/1023*100)+' %']],pins:[['A0',fi(v,2)+' V']],ser:`ADC=${a}  V=${f(a*5/1023)} V  Posisi=${Math.round(a/1023*100)} %`,
   bar:{v:a,max:1023,l:'ADC'}}}}},

{id:'joystick',nama:'Joystick KY-023',sub:'2 potensiometer XY + tombol',cat:'analog',iface:'Analog',besaran:'Posisi 2 sumbu',
 stok:{ada:true,info:'Kode 10, 12 pcs, kotak 2'},
 spec:[['Tegangan','5 V'],['Output','VRx, VRy: 0–5 V (tengah ≈ 2,5 V); SW: digital aktif LOW'],['Mekanik','2 potensiometer 10 kΩ + saklar tekan'],['Pin','GND, +5V, VRx, VRy, SW']],
 prinsip:`<p>KY-023 berisi dua potensiometer yang digerakkan tuas: satu untuk sumbu X, satu untuk sumbu Y. Saat tuas di tengah, kedua wiper ≈ 2,5 V (ADC ≈ 512). Menekan tuas menutup saklar ke GND, sehingga pin SW perlu <b>pull-up</b> (pakai <code>INPUT_PULLUP</code>) dan bernilai LOW saat ditekan.</p><p>Posisi tengah jarang tepat 512, jadi biasanya dipakai <b>deadzone</b> beberapa persen agar robot/servo tidak bergerak sendiri.</p>`,
 w:{mod:'KY-023',sub:'Joystick',pins:[['GND','GND'],['+5V','5V'],['VRx','A0'],['VRy','A1'],['SW','D2']]},

 code:`// Joystick KY-023
const int PIN_X = A0, PIN_Y = A1, PIN_SW = 2;

void setup() {
  Serial.begin(9600);
  pinMode(PIN_SW, INPUT_PULLUP);           // saklar ke GND, aktif LOW
}

void loop() {
  int x = analogRead(PIN_X);
  int y = analogRead(PIN_Y);
  bool tekan = digitalRead(PIN_SW) == LOW;
  int px = map(x, 0, 1023, -100, 100);
  int py = map(y, 0, 1023, -100, 100);
  if (abs(px) < 5) px = 0;                 // deadzone 5 %
  if (abs(py) < 5) py = 0;
  Serial.print("X=");  Serial.print(px);
  Serial.print("%  Y="); Serial.print(py);
  Serial.print("%  SW="); Serial.println(tekan ? "DITEKAN" : "-");
  delay(100);
}`,

 sim:{in:[{k:'x',l:'Tuas X',min:-100,max:100,step:1,u:'%',def:0},{k:'y',l:'Tuas Y',min:-100,max:100,step:1,u:'%',def:0},{k:'sw',l:'Tombol',opts:[[0,'dilepas'],[1,'ditekan']],def:0}],

{id:'ldr',nama:'LDR (Fotoresistor GL5528)',sub:'LDR + resistor 10 kΩ / modul LDR',cat:'analog',iface:'Analog',besaran:'Intensitas cahaya',
 stok:{ada:true,info:'LDR GL5528 5/7/12 mm (kode 123–125, @50 pcs, RAKO); modul LDR (kode 14, 12 pcs, kotak 26; E-127, kotak 26)'},
 spec:[['Tegangan','5 V'],['Resistansi','≈ 10–20 kΩ @10 lux, > 1 MΩ gelap'],['γ (gamma)','≈ 0,6–0,7 (GL5528)'],['Respons','naik ≈ 20 ms, turun ≈ 30 ms'],['Output','analog (pembagi tegangan); modul: AO + DO']],
 prinsip:`<p>LDR terbuat dari kadmium sulfida (CdS). Makin terang, makin banyak elektron yang terbebas, sehingga <b>resistansi turun</b> secara eksponensial: R ≈ R<sub>10</sub>·(lux/10)<sup>−γ</sup>. Karena Arduino membaca tegangan, LDR dipasang sebagai <b>pembagi tegangan</b> dengan resistor tetap 10 kΩ.</p><p>Pada rangkaian di wiring (LDR ke 5 V, 10 kΩ ke GND), tegangan A0 <b>naik saat terang</b>. Modul LDR 3/4-pin biasanya kebalikannya: AO naik saat gelap. DO berasal dari komparator LM393 dengan ambang yang diatur trimpot.</p>`,
 w:{mod:'LDR + R 10 kΩ',sub:'5V–LDR–A0–10k–GND',pins:[['Ujung LDR','5V'],['Titik tengah','A0'],['Ujung 10 kΩ','GND']],note:'Modul LDR: VCC→5V, GND→GND, AO→A0, DO→D2.'},
 lib:'',
 code:`// LDR + resistor 10k: 5V -- LDR -- A0 -- 10k -- GND
// (modul LDR: AO -> A0, DO -> D2)
const int PIN_AO = A0, PIN_DO = 2;
const float R_FIX = 10000.0;          // resistor pembagi

void setup() {
  Serial.begin(9600);
  pinMode(PIN_DO, INPUT);
}

void loop() {
  int adc = analogRead(PIN_AO);
  float v = adc * 5.0 / 1023.0;
  // LDR di atas (ke 5V), R_FIX di bawah (ke GND)
  float rLdr = (v > 0.01) ? R_FIX * (5.0 - v) / v : 1e7;
  // Pendekatan GL5528: R = 15k * (lux/10)^-0.7
  float lux = 10.0 * pow(rLdr / 15000.0, -1.0 / 0.7);
  Serial.print("ADC=");     Serial.print(adc);
  Serial.print("  R_LDR="); Serial.print(rLdr / 1000.0, 1);
  Serial.print(" kOhm  ~"); Serial.print(lux, 0);
  Serial.print(" lux  DO="); Serial.println(digitalRead(PIN_DO));
  delay(300);
}`,
 rumus:`<p>Pembagi tegangan: <b>V = 5·R<sub>fix</sub>/(R<sub>fix</sub>+R<sub>LDR</sub>)</b> → <b>R<sub>LDR</sub> = R<sub>fix</sub>(5−V)/V</b>.</p><p>Konversi ke lux hanya <b>perkiraan</b>, karena R<sub>10</sub> dan γ berbeda tiap LDR (toleransi besar). Untuk lux akurat, kalibrasi dengan lux meter atau BH1750 pada 3–4 kondisi cahaya, lalu cari R<sub>10</sub> dan γ dari regresi log–log.</p>`,
 masalah:['Nilai sensitif di gelap tetapi jenuh di terang: ganti R_FIX (1–4,7 kΩ untuk ruangan terang, 47–100 kΩ untuk gelap).','Lampu TL berkedip 100 Hz: rata-ratakan 20–50 sampel.','Modul: arah nilai terbalik dengan tutorial. Cek posisi LDR di modul.'],
 tugas:['Lampu otomatis: LED menyala bila gelap, dengan histeresis agar tidak berkedip.','Kalibrasi LDR terhadap BH1750: cari R10 dan γ dengan regresi log–log.','Ukur waktu respons LDR dengan LED berkedip dan millis().'],
 sim:{in:[{k:'lux',l:'Intensitas cahaya',min:0,max:4,step:0.01,log:1,u:'lux',def:2.3},{k:'rf',l:'R pembagi',opts:[[1000,'1 kΩ'],[4700,'4,7 kΩ'],[10000,'10 kΩ'],[47000,'47 kΩ']],def:10000}],
  out:(s,nz)=>{const lux=10**s.lux,R=15000*Math.pow(Math.max(lux,0.01)/10,-0.7),Rl=Math.min(R,2e6),v=5*s.rf/(+s.rf+Rl)+nz(0.004),a=ADC(v),vb=a*5/1023,rL=vb>0.01?s.rf*(5-vb)/vb:1e7,luxE=10*Math.pow(rL/15000,-1/0.7),dout=lux>50?0:1;
   return{rows:[['R LDR',fi(Rl/1000,1)+' kΩ'],['Tegangan A0',fi(v,3)+' V'],['ADC',a],['Lux terhitung',fi(luxE,0)+' lux'],['DO modul (ambang ~50 lux)',dout?'HIGH (gelap)':'LOW (terang)']],pins:[['A0',fi(v,2)+' V'],['D2',dout?'HIGH':'LOW']],ser:`ADC=${a}  R_LDR=${f(rL/1000,1)} kOhm  ~${f(luxE,0)} lux  DO=${dout}`,bar:{v:a,max:1023,l:'ADC'}}}}},

{id:'lm35',nama:'LM35',sub:'Sensor suhu analog 10 mV/°C',cat:'analog',iface:'Analog',besaran:'Suhu',

 prinsip:`<p>LM35 memanfaatkan sifat tegangan basis–emitor (V<sub>BE</sub>) transistor yang berubah linear terhadap suhu. Rangkaian internalnya (sensor band-gap) sudah dikalibrasi pabrik sehingga output langsung <b>10 mV per °C</b> dalam Celsius, tanpa offset.</p><p>Dengan V<sub>ref</sub> 5 V, satu langkah ADC = 4,9 mV ≈ 0,49 °C. Resolusi bisa ditingkatkan dengan <code>analogReference(INTERNAL)</code> (1,1 V): satu langkah = 0,11 °C, tetapi suhu maksimum menjadi 110 °C.</p>`,
 w:{mod:'LM35',sub:'(tampak depan, tulisan menghadap Anda)',pins:[['+Vs','5V'],['Vout','A0'],['GND','GND']]},
 lib:'',
 code:`// LM35: +Vs -> 5V, Vout -> A0, GND -> GND
const int PIN_LM35 = A0;

void setup() {
  Serial.begin(9600);
  // analogReference(INTERNAL);   // opsi: Vref 1,1 V (resolusi 0,11 C, maks 110 C)

void loop() {
  long sum = 0;
  for (int i = 0; i < 20; i++) {          // rata-rata 20 sampel

{id:'soil',nama:'Soil Moisture (resistif FC-28 / YL-69)',sub:'Kelembapan tanah, AO + DO (LM393)',cat:'analog',iface:'Analog',besaran:'Kelembapan tanah',
 stok:{ada:true,info:'Resistif anti karat E-239 (14 pcs, kotak 28) dan kode 24 HQ (10 pcs, kotak 28)'},
 spec:[['Tegangan','3,3 – 5 V'],['Output','AO 0–Vcc (kering ≈ tinggi), DO aktif LOW saat basah'],['Arus','≈ 35 mA (probe + LED)'],['Prinsip','resistansi tanah di antara dua elektroda']],
 prinsip:`<p>Dua elektroda ditanam di tanah. Air dan garam terlarut membuat tanah menghantar listrik, sehingga makin basah, <b>resistansi makin kecil</b>. Modul memakai pembagi tegangan sehingga AO <b>turun saat basah</b>, dan komparator LM393 membandingkannya dengan trimpot untuk menghasilkan DO.</p><p>Arus DC terus-menerus menyebabkan <b>elektrolisis</b>: elektroda cepat berkarat dan pembacaan bergeser. Karena itu VCC sensor disambungkan ke pin digital (D7) dan hanya dinyalakan sesaat saat membaca. Untuk pemakaian jangka panjang, gunakan sensor kapasitif (v1.2) yang elektrodanya tidak bersentuhan langsung dengan tanah.</p>`,
 w:{mod:'FC-28 + YL-69',sub:'modul komparator',pins:[['VCC','D7'],['GND','GND'],['DO','D3'],['AO','A0']],note:'VCC diberi daya dari D7 (arus < 20 mA per pin aman untuk modul ini).'},
 lib:'',
 code:`// Soil moisture resistif: VCC -> D7 (daya sesaat), AO -> A0, DO -> D3
const int PIN_PWR = 7, PIN_AO = A0, PIN_DO = 3;
const int ADC_KERING = 1015;    // kalibrasi: probe di udara
const int ADC_BASAH  = 360;     // kalibrasi: probe dicelup air

void setup() {
  Serial.begin(9600);
  pinMode(PIN_PWR, OUTPUT);
  digitalWrite(PIN_PWR, LOW);
  pinMode(PIN_DO, INPUT);
}

void loop() {
  digitalWrite(PIN_PWR, HIGH);           // nyalakan sensor
  delay(10);                             // tunggu stabil
  int adc = analogRead(PIN_AO);
  int d = digitalRead(PIN_DO);
  digitalWrite(PIN_PWR, LOW);            // matikan: kurangi korosi
  int persen = constrain(map(adc, ADC_KERING, ADC_BASAH, 0, 100), 0, 100);
  Serial.print("ADC=");          Serial.print(adc);
  Serial.print("  Kelembapan="); Serial.print(persen);
  Serial.print(" %  DO=");       Serial.println(d == LOW ? "BASAH" : "KERING");
  delay(1000);
}`,
 rumus:`<p>Konversi ke persen hanyalah <b>skala relatif</b> antara dua titik kalibrasi: <b>% = (ADC<sub>kering</sub> − ADC)/(ADC<sub>kering</sub> − ADC<sub>basah</sub>) × 100</b>. Nilai ini bukan kadar air volumetrik. Untuk kadar air sebenarnya, perlu kalibrasi gravimetri (timbang tanah basah dan kering oven) di jenis tanah yang sama.</p>`,
 masalah:['Nilai turun perlahan dari hari ke hari: elektroda berkarat. Pakai daya sesaat atau sensor kapasitif.','Selalu "basah": trimpot DO terlalu tinggi; putar sampai LED pas berganti di batas yang diinginkan.','Berbeda jauh antar pot: kadar garam/pupuk memengaruhi konduktivitas, jadi kalibrasi per media tanam.'],
 tugas:['Penyiraman otomatis: relay pompa ON saat kelembapan < 40 % dengan histeresis 10 %.','Bandingkan umur elektroda dengan daya terus-menerus vs daya sesaat selama 1 minggu.','Kalibrasi dengan metode gravimetri sederhana (timbang tanah) untuk 3 kadar air.'],
 sim:{in:[{k:'m',l:'Kelembapan tanah',min:0,max:100,step:1,u:'%',def:45},{k:'th',l:'Ambang trimpot DO',min:0,max:100,step:1,u:'%',def:50}],
  out:(s,nz)=>{const a=Math.round(1015-(1015-360)*s.m/100+nz(4)),v=a*5/1023,p=cl(Math.round((1015-a)/(1015-360)*100),0,100),d=s.m>=s.th?0:1;
   return{rows:[['Tegangan AO',fi(v,2)+' V'],['ADC',a],['Kelembapan relatif',p+' %'],['DO',d?'HIGH (kering)':'LOW (basah)']],pins:[['A0',fi(v,2)+' V'],['D3',d?'HIGH':'LOW'],['D7','HIGH saat baca']],ser:`ADC=${a}  Kelembapan=${p} %  DO=${d?'KERING':'BASAH'}`,bar:{v:p,max:100,l:'%'}}}}},

{id:'mq2',nama:'MQ-2 / MQ-135',sub:'Sensor gas semikonduktor SnO₂',cat:'analog',iface:'Analog',besaran:'Konsentrasi gas',
 stok:{ada:false,info:'Tidak tercatat di stok BHP'},
 spec:[['Tegangan','5 V (pemanas 150 mA)'],['MQ-2','LPG, propana, H₂, asap: 200–10.000 ppm'],['MQ-135','NH₃, NOx, benzena, CO₂ (kualitas udara)'],['Pemanasan awal','> 24 jam (pertama), 1–3 menit (berikutnya)'],['R<sub>L</sub> modul','1 kΩ atau 10 kΩ (kode SMD 102/103)']],
 prinsip:`<p>Elemen SnO₂ dipanaskan oleh heater internal (±300 °C). Di udara bersih, oksigen terserap di permukaan dan menangkap elektron, sehingga resistansi (R<sub>s</sub>) tinggi. Gas pereduksi (LPG, asap, alkohol) bereaksi dengan oksigen itu dan melepas elektron, sehingga <b>R<sub>s</sub> turun</b>. Modul memasang R<sub>s</sub> dengan R<sub>L</sub> sebagai pembagi tegangan, jadi AO <b>naik</b> saat ada gas.</p><p>Kurva datasheet berbentuk garis lurus di skala log–log: <b>log(ppm) = (log(R<sub>s</sub>/R<sub>0</sub>) − b)/m</b>. R<sub>0</sub> diukur di udara bersih (MQ-2: R<sub>s</sub>/R<sub>0</sub> ≈ 9,83). Sensor ini tidak selektif: alkohol pun terbaca sebagai "LPG".</p>`,
 w:{mod:'MQ-2 / MQ-135',sub:'modul FC-22',pins:[['VCC','5V'],['GND','GND'],['DO','D2'],['AO','A0']],note:'Heater menarik ±150 mA; pakai port USB yang kuat atau catu 5 V eksternal.'},
 lib:'',
 code:`// MQ-2: AO -> A0, DO -> D2
const int PIN_AO = A0, PIN_DO = 2;
const float RL = 10.0;           // kOhm, cek resistor beban di modul (103 = 10k, 102 = 1k)
const float RASIO_UDARA = 9.83;  // Rs/R0 di udara bersih (datasheet MQ-2)
float R0 = 10.0;                 // kOhm, diisi saat kalibrasi

float bacaRs() {
  long s = 0;
  for (int i = 0; i < 50; i++) { s += analogRead(PIN_AO); delay(5); }
  float v = (s / 50.0) * 5.0 / 1023.0;
  if (v < 0.01) v = 0.01;
  return RL * (5.0 - v) / v;       // kOhm
}

void setup() {
  Serial.begin(9600);
  pinMode(PIN_DO, INPUT);
  Serial.println("Pemanasan 60 s (pemakaian pertama: > 24 jam)...");
  delay(60000);
  R0 = bacaRs() / RASIO_UDARA;     // kalibrasi di udara bersih
  Serial.print("R0 = "); Serial.print(R0); Serial.println(" kOhm");
}

void loop() {
  float rasio = bacaRs() / R0;
  // Kurva LPG MQ-2 (log-log): log10(ppm) = (log10(Rs/R0) - 1.31) / -0.47
  float ppm = pow(10, (log10(rasio) - 1.31) / -0.47);
  Serial.print("Rs/R0=");  Serial.print(rasio, 2);
  Serial.print("  LPG~");  Serial.print(ppm, 0);
  Serial.print(" ppm  DO="); Serial.println(digitalRead(PIN_DO) == LOW ? "GAS!" : "aman");
  delay(1000);
}`,
 rumus:`<p><b>R<sub>s</sub> = R<sub>L</sub>(V<sub>c</sub> − V<sub>out</sub>)/V<sub>out</sub></b>, <b>R<sub>0</sub> = R<sub>s,udara</sub>/9,83</b>, lalu <b>ppm = 10<sup>(log(R<sub>s</sub>/R<sub>0</sub>) − b)/m</sup></b>. Untuk LPG pada MQ-2: m ≈ −0,47, b ≈ 1,31 (diambil dari 2 titik kurva datasheet). Konstanta m dan b berbeda untuk tiap gas dan tiap sensor (MQ-135 memakai kurva sendiri). Angka ppm hanya indikatif tanpa kalibrasi dengan gas standar.</p>`,
 masalah:['Nilai turun terus di menit-menit awal: belum selesai pemanasan.','ppm tidak masuk akal: R_L di kode tidak sama dengan resistor di modul.','Terpengaruh kelembapan dan suhu: datasheet memberi kurva koreksi; jangan dipakai sebagai alat keselamatan bersertifikat.'],
 tugas:['Alarm kebocoran gas dengan buzzer dan histeresis.','Plot log(Rs/R0) terhadap log(ppm) dari 3 titik kurva datasheet untuk menurunkan m dan b sendiri.','Bandingkan respons terhadap alkohol (hand sanitizer) dan korek gas (tanpa api).'],
 sim:{in:[{k:'ppm',l:'Konsentrasi LPG',min:0,max:4,step:0.01,log:1,u:'ppm',def:2.5},{k:'rl',l:'R_L modul',opts:[[1,'1 kΩ'],[10,'10 kΩ']],def:10}],
  out:(s,nz)=>{const ppm=10**s.ppm,R0=10,rat=ppm<5?9.83:Math.min(9.83,Math.pow(10,-0.47*Math.log10(ppm)+1.31)),Rs=R0*rat,v=5*s.rl/(Rs+ +s.rl)+nz(0.004),a=ADC(v),vb=Math.max(a*5/1023,0.01),rsE=s.rl*(5-vb)/vb,ppE=Math.pow(10,(Math.log10(rsE/R0)-1.31)/-0.47),d=ppm>1000?0:1;
   return{rows:[['Rs/R0',fi(rat,2)],['Rs',fi(Rs,1)+' kΩ'],['Tegangan AO',fi(v,2)+' V'],['ADC',a],['ppm terhitung',fi(ppE,0)],['DO (ambang ±1000 ppm)',d?'HIGH (aman)':'LOW (gas!)']],pins:[['A0',fi(v,2)+' V'],['D2',d?'HIGH':'LOW']],ser:`Rs/R0=${f(rsE/R0)}  LPG~${f(ppE,0)} ppm  DO=${d?'aman':'GAS!'}`,bar:{v:a,max:1023,l:'ADC'}}}}},

{id:'sharp',nama:'Sharp GP2Y0A21YK0F',sub:'Sensor jarak IR triangulasi 10–80 cm',cat:'analog',iface:'Analog',besaran:'Jarak',
 stok:{ada:false,info:'Tidak tercatat di stok BHP'},
 spec:[['Tegangan','4,5 – 5,5 V, arus rata-rata 30 mA (puncak ±300 mA)'],['Rentang','10 – 80 cm'],['Output','analog, nonlinear (≈ 2,3 V @10 cm; 0,4 V @80 cm)'],['Periode ukur','38 ms'],['Konektor','JST 3-pin: Vo (kuning), GND (hitam), Vcc (merah)']],
 prinsip:`<p>LED IR memancarkan berkas ke objek. Cahaya pantulan jatuh ke <b>PSD (position sensitive detector)</b> melalui lensa. Makin dekat objek, makin besar sudut pantul dan makin jauh posisi titik cahaya di PSD. Inilah prinsip <b>triangulasi</b>, sehingga warna objek hanya sedikit berpengaruh (berbeda dengan sensor IR pantulan biasa).</p><p>Output-nya <b>tidak linear</b>: tegangan kira-kira berbanding terbalik dengan jarak. Di bawah 10 cm, tegangan turun lagi sehingga satu tegangan bisa berarti dua jarak (<b>ambigu</b>).</p>`,
 w:{mod:'GP2Y0A21',sub:'JST: Vo · GND · Vcc',pins:[['Vo (kuning)','A0'],['GND (hitam)','GND'],['Vcc (merah)','5V']],note:'Pasang kapasitor elco 10–100 µF dekat Vcc–GND untuk meredam lonjakan arus LED.'},
 lib:'',
 code:`// Sharp GP2Y0A21: Vo -> A0
const int PIN_IR = A0;

void setup() {
  Serial.begin(9600);
}

void loop() {
  long s = 0;
  for (int i = 0; i < 25; i++) { s += analogRead(PIN_IR); delay(2); }
  float v = (s / 25.0) * 5.0 / 1023.0;
  float jarak = 27.728 * pow(v, -1.2045);     // cm, fit kurva datasheet
  Serial.print("V="); Serial.print(v, 2); Serial.print(" V  Jarak=");
  if (v < 0.35)      Serial.println("> 80 cm (di luar rentang)");
  else if (v > 2.4)  Serial.println("< 10 cm (ambigu!)");
  else { Serial.print(jarak, 1); Serial.println(" cm"); }
  delay(100);
}`,
 rumus:`<p>Fit kurva yang umum dipakai: <b>d = 27,728 · V<sup>−1,2045</sup></b> (cm). Tiap unit sedikit berbeda; kalibrasi dengan mengukur V pada 10, 20, … 80 cm lalu fit <b>d = a·V<sup>b</sup></b> (regresi linear di skala log–log) atau pakai tabel <i>lookup</i> dengan interpolasi.</p>`,
 masalah:['Pembacaan bergetar: lonjakan arus LED, jadi pasang elco 10 µF dan rata-ratakan.','Jarak dekat terbaca jauh: objek < 10 cm (ambigu), pasang sensor mundur 10 cm dari tepi robot.','Objek mengkilap/kaca memberi nilai acak.'],
 tugas:['Kalibrasi kurva sendiri pada 8 jarak dan bandingkan dengan rumus umum.','Bandingkan dengan HC-SR04 pada permukaan kain, kayu, dan kaca.','Robot penjaga jarak 25 cm (kontrol P ke motor).'],
 sim:{in:[{k:'d',l:'Jarak objek',min:4,max:100,step:0.5,u:'cm',def:30}],
  out:(s,nz)=>{const d=s.d;let v=d>=10?Math.pow(27.728/d,1/1.2045):2.33*(d/10)**0.9;v=Math.max(0.3,v)+nz(0.01);const a=ADC(v),vb=a*5/1023,dE=27.728*Math.pow(vb,-1.2045),st=vb<0.35?'> 80 cm':vb>2.4?'< 10 cm (ambigu)':fi(dE,1)+' cm';
   return{rows:[['Tegangan Vo',fi(v,3)+' V'],['ADC',a],['Jarak terhitung',st]],pins:[['A0',fi(v,2)+' V']],ser:`V=${f(vb)} V  Jarak=${st}`,curve:{x:d,fn:x=>x>=10?Math.pow(27.728/x,1/1.2045):2.33*(x/10)**0.9,x0:4,x1:100,xl:'cm',yl:'V'}}}}},

{id:'ky038',nama:'Sensor Suara KY-038',sub:'Mikrofon elektret + LM393',cat:'analog',iface:'Analog',besaran:'Level suara',
 stok:{ada:false,info:'Tidak tercatat di stok BHP'},
 spec:[['Tegangan','3,3 – 5 V'],['AO','sinyal audio di sekitar ≈ Vcc/2 (amplitudo kecil)'],['DO','HIGH saat amplitudo melewati ambang (trimpot)'],['Catatan','bukan pengukur dB terkalibrasi']],
 prinsip:`<p>Mikrofon elektret mengubah tekanan suara menjadi sinyal listrik kecil yang ditumpangkan pada tegangan DC sekitar setengah Vcc. Yang menunjukkan kerasnya suara adalah <b>amplitudo (puncak–puncak)</b>, bukan nilai rata-rata. Karena itu kode mencari nilai min dan maks dalam jendela 50 ms.</p><p>Karena tidak ada penguat yang memadai, sensitivitas AO rendah: bicara normal hanya mengubah ADC beberapa langkah. DO cocok untuk deteksi tepukan.</p>`,
 w:{mod:'KY-038',sub:'mic + LM393',pins:[['AO','A0'],['G','GND'],['+','5V'],['DO','D2']]},
 lib:'',
 code:`// KY-038: AO -> A0, DO -> D2
const int PIN_AO = A0, PIN_DO = 2;

void setup() {
  Serial.begin(115200);
  pinMode(PIN_DO, INPUT);
}

void loop() {
  unsigned long t0 = millis();
  int mn = 1023, mx = 0;
  while (millis() - t0 < 50) {          // jendela 50 ms
    int a = analogRead(PIN_AO);
    if (a < mn) mn = a;
    if (a > mx) mx = a;
  }
  int pp = mx - mn;                     // puncak-puncak (langkah ADC)
  float vpp = pp * 5.0 / 1023.0;
  Serial.print("Vpp="); Serial.print(vpp, 3); Serial.print(" V  level=");
  for (int i = 0; i < pp / 10; i++) Serial.print('#');
  Serial.print("  DO="); Serial.println(digitalRead(PIN_DO));
}`,
 rumus:`<p>Level relatif dalam dB: <b>L = 20·log<sub>10</sub>(V<sub>pp</sub>/V<sub>pp,ref</sub>)</b>. Untuk dB SPL sebenarnya perlu kalibrasi dengan sound level meter dan penguat yang layak (misalnya modul MAX4466/MAX9814).</p>`,
 masalah:['AO hampir tidak berubah: wajar, karena tanpa penguat. Ukur puncak–puncak, bukan nilai sesaat.','DO selalu HIGH: trimpot terlalu sensitif, putar sampai LED DO padam saat hening.','Noise dari motor/servo: pisahkan catu daya.'],
 tugas:['Saklar tepuk tangan dua kali untuk menyalakan lampu (deteksi 2 pulsa dalam 1 s).','Bar-graph level suara di 8 LED.','Ukur waktu antara dua tepukan untuk estimasi tempo (BPM).'],
 sim:{in:[{k:'db',l:'Kerasnya suara',min:30,max:100,step:1,u:'dB',def:60},{k:'th',l:'Ambang DO',min:30,max:100,step:1,u:'dB',def:75}],
  out:(s,nz)=>{const vpp=Math.min(4.5,0.004*Math.pow(10,(s.db-30)/20)),pp=Math.round(vpp/5*1023),d=s.db>=s.th?1:0,y=sineWave(2.5,vpp/2,6,240).map(v=>v+nz(0.003));
   return{rows:[['Amplitudo Vpp',fi(vpp,3)+' V'],['Puncak–puncak ADC',pp+' langkah'],['DO',d?'HIGH (keras)':'LOW']],pins:[['A0','≈2,5 V ± '+fi(vpp/2,3)],['D2',d?'HIGH':'LOW']],ser:`Vpp=${f(vpp,3)} V  level=${'#'.repeat(Math.min(60,Math.floor(pp/10)))}  DO=${d}`,

{id:'acs712',nama:'ACS712 (20 A)',sub:'Sensor arus efek Hall, DC & AC',cat:'analog',iface:'Analog',besaran:'Arus listrik',
 stok:{ada:true,info:'Modul ACS712 20A, kode 15, 12 pcs, kotak 25'},
 spec:[['Tegangan','5 V'],['Varian','5 A (185 mV/A), 20 A (100 mV/A), 30 A (66 mV/A)'],['Output','2,5 V saat 0 A (ratiometric), ±'],['Isolasi','2,1 kV RMS (jalur arus terpisah dari sinyal)'],['Bandwidth','80 kHz'],['Resistansi jalur','1,2 mΩ']],
 prinsip:`<p>Arus yang diukur mengalir melalui jalur tembaga di dalam IC. Medan magnet yang dihasilkannya dideteksi oleh sensor <b>efek Hall</b>, lalu diubah menjadi tegangan. Karena kopling magnetik, sisi pengukuran terisolasi dari Arduino. Output 2,5 V berarti 0 A; arus positif menaikkan, arus negatif menurunkan tegangan.</p><p>Resolusi ADC (4,9 mV) setara <b>49 mA</b> untuk versi 20 A, jadi versi ini kurang cocok untuk arus kecil (< 0,5 A). Offset nol bergeser terhadap suhu dan Vcc, sehingga perlu dikalibrasi saat start.</p>`,
 w:{mod:'ACS712-20A',sub:'IP+ / IP− seri dengan beban',pins:[['VCC','5V'],['OUT','A0'],['GND','GND']],note:'Terminal IP+ dan IP− dipasang SERI dengan beban (seperti amperemeter). Jangan paralel dengan sumber!'},
 lib:'',
 code:`// ACS712-20A: OUT -> A0. Jalur IP+/IP- seri dengan beban.
const int PIN_ACS = A0;
const float SENS = 0.100;     // V/A (5A: 0.185, 20A: 0.100, 30A: 0.066)
float vNol = 2.5;             // offset 0 A, dikalibrasi saat start

float bacaV(int n) {
  long s = 0;
  for (int i = 0; i < n; i++) s += analogRead(PIN_ACS);
  return (s / (float)n) * 5.0 / 1023.0;
}

void setup() {
  Serial.begin(9600);
  delay(500);
  vNol = bacaV(500);          // pastikan beban MATI saat start
  Serial.print("Offset nol = "); Serial.print(vNol, 3); Serial.println(" V");
}

void loop() {
  float v = bacaV(200);
  float arusDC = (v - vNol) / SENS;
  // Arus AC: RMS deviasi terhadap offset selama 100 ms (5 siklus 50 Hz)
  float sum2 = 0; int n = 0;
  unsigned long t0 = millis();
  while (millis() - t0 < 100) {
    float d = analogRead(PIN_ACS) * 5.0 / 1023.0 - vNol;
    sum2 += d * d; n++;
  }
  float arusRMS = sqrt(sum2 / n) / SENS;
  Serial.print("Vout=");   Serial.print(v, 3);
  Serial.print(" V  I_DC="); Serial.print(arusDC, 2);
  Serial.print(" A  I_RMS(AC)="); Serial.print(arusRMS, 2); Serial.println(" A");
  delay(500);
}`,
 rumus:`<p><b>I = (V<sub>out</sub> − V<sub>nol</sub>)/S</b>, S = 0,100 V/A (20 A). Untuk AC: <b>I<sub>rms</sub> = √(mean((V − V<sub>nol</sub>)²))/S</b>. Kalibrasi gain dengan beban yang arusnya diketahui (misalnya lampu + multimeter/tang ampere).</p>`,
 masalah:['Terbaca ±0,1–0,2 A saat tanpa beban: noise ADC (1 langkah = 49 mA). Rata-ratakan dan buat deadband.','Offset bukan 2,5 V: Vcc USB ≠ 5,00 V (output ratiometric). Kalibrasi nol di setup().','Untuk AC 220 V: pastikan terminal tertutup isolasi; jangan sentuh saat menyala.'],
 tugas:['Ukur arus motor DC 775 (stok no. 44) saat start dan saat stabil, lalu tampilkan lonjakan arus start.','Wattmeter DC: gabungkan dengan sensor tegangan 0–25 V untuk P = V·I.','Bandingkan pembacaan dengan multimeter pada 5 titik beban, lalu hitung error.'],
 sim:{in:[{k:'i',l:'Arus beban',min:-20,max:20,step:0.1,u:'A',def:3},{k:'vcc',l:'Vcc sebenarnya',min:4.6,max:5.2,step:0.01,u:'V',def:5}],
  out:(s,nz)=>{const vcc=+s.vcc,v=vcc/2+0.1*s.i*vcc/5+nz(0.003),a=Math.round(cl(v/vcc*1023,0,1023)),vb=a*5/1023,iE=(vb-2.5)/0.1;
   return{rows:[['Vout',fi(v,3)+' V'],['ADC',a],['I tanpa kalibrasi nol',fi(iE,2)+' A'],['I dengan kalibrasi nol',fi((vb-(vcc/2)*5/vcc)/0.1,2)+' A'],['Resolusi',fi(5/1023/0.1*1000,0)+' mA/langkah']],pins:[['A0',fi(v,3)+' V']],ser:`Vout=${f(vb,3)} V  I_DC=${f(iE)} A`,bar:{v:s.i+20,max:40,l:'A (−20…20)'}}}}},

{id:'zmct103c',nama:'ZMCT103C (5 A AC)',sub:'Trafo arus (CT) + op-amp',cat:'analog',iface:'Analog',besaran:'Arus AC',
 stok:{ada:true,info:'Sensor arus 5A single phase ZMCT103C, E-247, 30 pcs, kotak 25'},
 spec:[['Tegangan','5 V'],['CT','5 A : 5 mA (1000:1), isolasi 3 kV'],['Output','sinus di sekitar Vcc/2, amplitudo diatur trimpot'],['Hanya','arus AC (CT tidak meneruskan DC)']],
 prinsip:`<p>Kabel fasa beban dimasukkan <b>melewati lubang</b> trafo arus (primer 1 lilitan). Arus sekunder 1000× lebih kecil dialirkan ke resistor burden menjadi tegangan, lalu dikuatkan op-amp dan ditumpangkan pada Vcc/2 agar bisa dibaca ADC yang hanya menerima tegangan positif.</p><p>Arduino mencuplik sinyal selama beberapa siklus (≥ 100 ms = 5 siklus 50 Hz), menghitung offset rata-rata, lalu nilai <b>RMS</b> deviasinya. Faktor skala (A per V<sub>rms</sub>) bergantung pada posisi trimpot, sehingga harus dikalibrasi dengan tang ampere.</p>`,
 w:{mod:'ZMCT103C',sub:'kabel fasa lewat lubang CT',pins:[['VCC','5V'],['GND','GND'],['OUT','A0']],note:'Hanya SATU kabel (fasa) yang lewat lubang CT. Bila fasa dan netral sama-sama lewat, medannya saling meniadakan dan terbaca 0 A.'},
 lib:'',
 code:`// ZMCT103C: OUT -> A0. Kabel FASA beban dimasukkan ke lubang CT.
const int PIN_CT = A0;
float K_CAL = 5.0;            // A per Vrms -> kalibrasi dengan tang ampere

void setup() {
  Serial.begin(9600);
}

void loop() {
  // 1) offset rata-rata selama 100 ms
  long s = 0; int n = 0;
  unsigned long t0 = millis();
  while (millis() - t0 < 100) { s += analogRead(PIN_CT); n++; }
  float offset = (float)s / n;
  // 2) RMS deviasi selama 100 ms
  float sum2 = 0; n = 0; t0 = millis();
  while (millis() - t0 < 100) {
    float d = analogRead(PIN_CT) - offset;
    sum2 += d * d; n++;
  }
  float vrms = sqrt(sum2 / n) * 5.0 / 1023.0;
  float irms = vrms * K_CAL;
  if (irms < 0.05) irms = 0;  // buang noise
  Serial.print("Vrms=");  Serial.print(vrms * 1000, 1);
  Serial.print(" mV  Irms="); Serial.print(irms, 3);
  Serial.print(" A  P~");  Serial.print(irms * 220, 0);
  Serial.println(" W (asumsi PF=1)");
  delay(500);
}`,
 rumus:`<p><b>V<sub>rms</sub> = √(Σ(ADC − offset)²/n) × 5/1023</b>, <b>I<sub>rms</sub> = K·V<sub>rms</sub></b>. Kalibrasi K: nyalakan beban yang diketahui (misalnya setrika 350 W ≈ 1,6 A), ukur I dengan tang ampere, lalu <b>K = I<sub>tang</sub>/V<sub>rms</sub></b>. Daya semu S = V·I; daya nyata memerlukan sensor tegangan sekaligus untuk menghitung faktor daya.</p>`,
 masalah:['Terbaca 0: fasa dan netral lewat lubang bersamaan, atau trimpot gain minimum.','Noise ≈ 30–50 mA tanpa beban: buat ambang buang noise.','Bentuk sinyal terpotong (clipping): gain trimpot terlalu besar untuk arus 5 A.'],
 tugas:['Kalibrasi K dengan tang ampere memakai 3 beban berbeda.','Monitor energi (kWh) harian dengan integrasi daya per detik.','Gabungkan dengan ZMPT101B untuk menghitung faktor daya beban induktif (kipas).'],
 sim:{in:[{k:'i',l:'Arus beban (RMS)',min:0,max:5,step:0.05,u:'A',def:1.6},{k:'k',l:'Faktor K di kode',min:3,max:7,step:0.1,u:'A/V',def:5}],
  out:(s,nz)=>{const vr=s.i/5,amp=vr*Math.SQRT2,y=sineWave(2.5,amp,5,250).map(v=>cl(v+nz(0.004),0,5)),I=vr*s.k;
   return{rows:[['Amplitudo puncak',fi(amp,3)+' V'],['Vrms output',fi(vr*1000,1)+' mV'],['Irms terhitung',fi(I,3)+' A'+(Math.abs(s.k-5)>0.05?' (K belum tepat)':'')]],pins:[['A0','2,5 V ± '+fi(amp,2)+' V (50 Hz)']],ser:`Vrms=${f(vr*1000,1)} mV  Irms=${f(I,3)} A  P~${f(I*220,0)} W`,
   wave:{a:[{n:'OUT (V)',y,c:'--sig1'}],ylo:0,yhi:5,t1:100,unit:'ms'}}}}},

{id:'zmpt101b',nama:'ZMPT101B',sub:'Sensor tegangan AC (trafo tegangan)',cat:'analog',iface:'Analog',besaran:'Tegangan AC',
 stok:{ada:false,info:'Tidak tercatat di stok BHP'},
 spec:[['Tegangan modul','5 V'],['Input','AC hingga 250 V (L–N)'],['Isolasi','trafo tegangan mini 2 mA:2 mA'],['Output','sinus di sekitar Vcc/2, gain trimpot']],
 prinsip:`<p>Tegangan jala-jala dihubungkan ke primer trafo mini melalui resistor pembatas, sehingga arus primer kecil (≈ 2 mA). Arus sekunder diubah menjadi tegangan dan dikuatkan op-amp, lalu ditumpangkan pada Vcc/2. Pengolahannya sama dengan ZMCT103C: cuplik ≥ 5 siklus, hitung RMS deviasi, lalu kalikan faktor kalibrasi.</p><p class="warn">⚠ Terminal input bertegangan 220 V. Rakit dalam kotak tertutup, gunakan sekring, dan jangan menyentuh PCB saat terhubung.</p>`,
 w:{mod:'ZMPT101B',sub:'input L–N 220 V',pins:[['VCC','5V'],['OUT','A0'],['GND','GND']],note:'Sisi input (2 terminal sekrup) ke L dan N melalui sekring 0,5 A. Isolasi semua terminal 220 V!'},
 lib:'',
 code:`// ZMPT101B: OUT -> A0. Input L-N 220 V (HATI-HATI)
const int PIN_V = A0;
float K_CAL = 440.0;          // V per Vrms output -> kalibrasi dengan multimeter

void setup() {
  Serial.begin(9600);
}

void loop() {
  long s = 0; int n = 0;
  unsigned long t0 = millis();
  while (millis() - t0 < 100) { s += analogRead(PIN_V); n++; }
  float offset = (float)s / n;
  float sum2 = 0; n = 0; t0 = millis();
  while (millis() - t0 < 100) {
    float d = analogRead(PIN_V) - offset;
    sum2 += d * d; n++;
  }
  float vrmsOut = sqrt(sum2 / n) * 5.0 / 1023.0;
  float vJala = vrmsOut * K_CAL;
  if (vJala < 10) vJala = 0;
  Serial.print("Vrms_out="); Serial.print(vrmsOut, 3);
  Serial.print(" V  V_jala="); Serial.print(vJala, 1); Serial.println(" V");
  delay(500);
}`,
 rumus:`<p><b>V<sub>jala</sub> = K·V<sub>rms,out</sub></b>; kalibrasi <b>K = V<sub>multimeter</sub>/V<sub>rms,out</sub></b>. Atur trimpot agar puncak sinyal ±1,5 V (tidak clipping) pada tegangan tertinggi yang diharapkan.</p>`,
 masalah:['Bentuk gelombang terpotong: gain trimpot terlalu besar.','Nilai berubah saat beban lain menyala: itu tegangan jala-jala yang memang turun (drop).','Pembacaan meleset ±5 %: jumlah sampel per periode terlalu sedikit (analogRead ±112 µs → ±178 sampel per 20 ms sudah cukup).'],
 tugas:['Pencatat kualitas tegangan: catat tegangan minimum/maksimum harian.','Proteksi tegangan: relay memutus beban jika > 240 V atau < 190 V.','Gabungkan dengan ZMCT103C untuk daya nyata P = mean(v·i).'],
 sim:{in:[{k:'v',l:'Tegangan jala-jala',min:0,max:250,step:1,u:'V',def:220},{k:'k',l:'Faktor K di kode',min:380,max:500,step:1,u:'',def:440}],
  out:(s,nz)=>{const vr=s.v/440,amp=vr*Math.SQRT2,y=sineWave(2.5,amp,5,250).map(v=>cl(v+nz(0.004),0,5)),V=vr*s.k;
   return{rows:[['Amplitudo puncak',fi(amp,3)+' V'+(amp>2.5?' (clipping!)':'')],['Vrms output',fi(vr,3)+' V'],['V jala terhitung',fi(V,1)+' V']],pins:[['A0','2,5 V ± '+fi(amp,2)+' V']],ser:`Vrms_out=${f(vr,3)} V  V_jala=${f(V,1)} V`,
   wave:{a:[{n:'OUT (V)',y,c:'--sig1'}],ylo:0,yhi:5,t1:100,unit:'ms'}}}}},

{id:'voltdc',nama:'Sensor Tegangan DC 0–25 V',sub:'Pembagi tegangan 30 kΩ / 7,5 kΩ',cat:'analog',iface:'Analog',besaran:'Tegangan DC',
 stok:{ada:true,info:'E-240 (20 pcs) dan E-245 (20 pcs), kotak 2'},
 spec:[['Input','0 – 25 V DC (Arduino 5 V)'],['Rasio','1 : 5 (R1 = 30 kΩ, R2 = 7,5 kΩ)'],['Resolusi','≈ 24 mV (25 V / 1023)'],['Impedansi','37,5 kΩ (membebani sumber sedikit)']],
 prinsip:`<p>Modul ini hanyalah <b>pembagi tegangan resistif</b>: V<sub>S</sub> = V<sub>in</sub>·R2/(R1+R2) = V<sub>in</sub>/5. Dengan begitu, tegangan hingga 25 V aman dibaca ADC 0–5 V. Terminal "+" di header modul tidak terhubung ke rangkaian; yang dipakai hanya S (sinyal) dan − (GND).</p><p>GND sumber yang diukur akan tersambung ke GND Arduino, jadi modul ini <b>tidak terisolasi</b>. Jangan dipakai untuk tegangan AC atau sumber yang GND-nya berbeda potensial.</p>`,
 w:{mod:'Voltage Sensor 0–25V',sub:'VCC/GND input ↔ S, +, −',pins:[['S','A0'],['−','GND']],note:'Terminal sekrup VCC/GND = tegangan yang diukur (misalnya baterai 12 V). Pin "+" tidak perlu disambung.'},
 lib:'',
 code:`// Sensor tegangan DC 0-25 V: S -> A0, (-) -> GND
const int PIN_S = A0;
const float R1 = 30000.0, R2 = 7500.0;   // pembagi di modul

void setup() {
  Serial.begin(9600);
}

void loop() {
  long s = 0;
  for (int i = 0; i < 20; i++) s += analogRead(PIN_S);
  float vA0 = (s / 20.0) * 5.0 / 1023.0;
  float vIn = vA0 * (R1 + R2) / R2;        // = vA0 x 5
  Serial.print("V_A0="); Serial.print(vA0, 3);
  Serial.print(" V  V_in="); Serial.print(vIn, 2); Serial.println(" V");
  delay(500);
}`,
 rumus:`<p><b>V<sub>in</sub> = V<sub>A0</sub> × (R1+R2)/R2 = 5 × V<sub>A0</sub></b>. Akurasi dibatasi toleransi resistor (1–5 %) dan V<sub>ref</sub>. Kalibrasi gain dengan multimeter: <b>faktor = V<sub>multimeter</sub>/V<sub>A0</sub></b>.</p>`,

{id:'phtanah',nama:'Sensor pH (analog 0–5 V)',sub:'Probe pH tanah/air dengan output tegangan',cat:'analog',iface:'Analog',besaran:'pH',
 stok:{ada:true,info:'Sensor pH tanah 0–5 V, kode 8, 2 pcs, kotak 27'},
 spec:[['Output','0 – 5 V (cek datasheet: sebagian modul perlu catu 12–24 V)'],['Rentang','umumnya pH 3–9 (tanah) atau 0–14 (air)'],['Kalibrasi','buffer pH 4,01 dan 6,86 (atau 9,18)'],['Waktu respons','30 – 60 s']],
 prinsip:`<p>Elektroda kaca pH menghasilkan beda potensial yang sebanding dengan aktivitas ion H⁺: sekitar <b>−59,16 mV per satuan pH</b> pada 25 °C (persamaan Nernst), dengan 0 mV di pH 7. Sinyal ini berimpedansi sangat tinggi, sehingga modul memakai penguat dan menggesernya ke 0–5 V.</p><p>Karena gain dan offset tiap probe berbeda dan berubah seiring umur, pengukuran pH <b>wajib dikalibrasi</b> dengan minimal dua larutan buffer. Kode memakai kalibrasi 2 titik: pH 4,01 dan 6,86.</p>`,
 w:{mod:'Sensor pH 0–5V',sub:'transmitter/probe',pins:[['VCC','5V'],['GND','GND'],['AOUT','A0']],note:'Periksa label/datasheet: beberapa transmitter pH tanah perlu catu 12–24 V (beri daya terpisah, GND disatukan).'},
 lib:'',
 code:`// Sensor pH analog: AOUT -> A0, kalibrasi 2 titik
const int PIN_PH = A0;
// Isi dengan tegangan terbaca saat probe di buffer pH 4,01 dan 6,86
float V_PH4 = 1.43, V_PH7 = 2.45;

void setup() {
  Serial.begin(9600);
}

void loop() {
  long s = 0;
  for (int i = 0; i < 30; i++) { s += analogRead(PIN_PH); delay(10); }
  float v = (s / 30.0) * 5.0 / 1023.0;
  float slope = (6.86 - 4.01) / (V_PH7 - V_PH4);   // pH per volt
  float ph = 6.86 + (v - V_PH7) * slope;
  Serial.print("V="); Serial.print(v, 3);
  Serial.print("  pH="); Serial.println(ph, 2);
  delay(1000);
}`,
 rumus:`<p>Kalibrasi 2 titik: <b>pH = 6,86 + (V − V<sub>6,86</sub>)·(6,86 − 4,01)/(V<sub>6,86</sub> − V<sub>4,01</sub>)</b>. Cek <i>slope</i>: elektroda yang sehat memberi 95–102 % dari slope Nernst. Jika < 90 %, elektroda sudah aus. Untuk pH tanah, campur tanah dan air suling 1:2,5 lalu ukur larutannya, atau ikuti petunjuk probe tusuk.</p>`,
 masalah:['Nilai melayang terus: probe kering atau belum direndam (simpan dalam larutan KCl 3M).','Beda jauh dengan pH meter: belum dikalibrasi atau buffer kedaluwarsa.','GND loop: catu terpisah tanpa GND bersama membuat nilai tidak masuk akal.'],
 tugas:['Kalibrasi 2 titik dan verifikasi dengan buffer ke-3 (pH 9,18).','Hitung efisiensi slope (%) terhadap Nernst 59,16 mV/pH.','Ukur pH tanah 3 lokasi kampus dengan metode larutan 1:2,5.'],
 sim:{in:[{k:'ph',l:'pH sebenarnya',min:3,max:10,step:0.01,u:'',def:6.5},{k:'cal',l:'Kalibrasi di kode',opts:[[1,'sudah (sesuai probe)'],[0,'belum (nilai default salah 8 %)']],def:1}],
  out:(s,nz)=>{const v=5*s.ph/14+nz(0.003),a=ADC(v),vb=a*5/1023,V4=+s.cal?1.432:1.36,V7=+s.cal?2.45:2.42,ph=6.86+(vb-V7)*(6.86-4.01)/(V7-V4);
   return{rows:[['Tegangan AOUT',fi(v,3)+' V'],['ADC',a],['pH terhitung',fi(ph,2)],['Error',fi(ph-s.ph,2)+' pH']],pins:[['A0',fi(v,3)+' V']],ser:`V=${f(vb,3)}  pH=${f(ph)}`,bar:{v:ph,max:14,l:'pH'}}}}},

{id:'tds',nama:'TDS Meter Analog V1.0',sub:'Konduktivitas air → TDS (ppm)',cat:'analog',iface:'Analog',besaran:'Total Dissolved Solids',
 stok:{ada:true,info:'Sensor TDS analog V1.0, kode 9, 6 pcs, kotak 27 (+ Xiaomi TDS pen 3 pcs, kotak 26 sebagai acuan)'},
 spec:[['Tegangan','3,3 – 5,5 V'],['Output','0 – 2,3 V'],['Rentang','0 – 1000 ppm'],['Akurasi','±10 % FS @25 °C'],['Probe','2 elektroda, eksitasi AC (anti polarisasi)']],
 prinsip:`<p>Ion terlarut (garam, mineral) membuat air menghantarkan listrik. Modul memberi <b>tegangan AC</b> ke dua elektroda agar tidak terjadi polarisasi/elektrolisis, lalu menyearahkan hasilnya menjadi tegangan DC yang sebanding dengan konduktivitas (EC). TDS (ppm) ≈ EC (µS/cm) × 0,5.</p><p>Konduktivitas naik sekitar <b>2 % per °C</b>, jadi tegangan dikompensasi ke 25 °C. Sensor ini relevan langsung dengan WTP/RO PUTOI: air baku sekitar 200 ppm, permeat 10–20 ppm.</p>`,
 w:{mod:'TDS Meter V1.0',sub:'board + probe',pins:[['+','5V'],['−','GND'],['A','A0']],note:'Jangan menyalakan TDS bersamaan dengan sensor pH di wadah yang sama tanpa isolasi (saling ganggu).'},
 lib:'',
 code:`// TDS Meter V1.0: A -> A0
const int PIN_TDS = A0;
float suhu = 25.0;            // C, ganti dengan pembacaan DS18B20 bila ada

void setup() {
  Serial.begin(9600);
}

void loop() {
  long s = 0;
  for (int i = 0; i < 30; i++) { s += analogRead(PIN_TDS); delay(10); }
  float v = (s / 30.0) * 5.0 / 1023.0;
  float koef = 1.0 + 0.02 * (suhu - 25.0);          // kompensasi suhu
  float vk = v / koef;
  float tds = (133.42 * vk * vk * vk - 255.86 * vk * vk + 857.39 * vk) * 0.5;
  Serial.print("V=");     Serial.print(v, 3);
  Serial.print("  TDS="); Serial.print(tds, 0);
  Serial.print(" ppm  EC~"); Serial.print(tds * 2, 0); Serial.println(" uS/cm");
  delay(1000);
}`,
 rumus:`<p><b>V<sub>25</sub> = V/(1 + 0,02(T − 25))</b>, lalu <b>TDS = 0,5·(133,42V³ − 255,86V² + 857,39V)</b> (kurva DFRobot Gravity TDS). Kalibrasi dengan larutan standar (misalnya 707 ppm) atau bandingkan dengan TDS pen: <b>k = TDS<sub>acuan</sub>/TDS<sub>terbaca</sub></b>.</p>`,
 masalah:['Nilai berbeda dengan TDS pen: suhu tidak dikompensasi atau faktor TDS berbeda (0,5 vs 0,7).','Air RO terbaca 0: wajar, di bawah resolusi (±10 ppm).','Probe terkena udara: nilai acak, pastikan elektroda terendam penuh.'],
 tugas:['Ukur TDS air baku, air setelah filter karbon, dan permeat RO PUTOI; hitung salt rejection.','Kompensasi suhu otomatis dengan DS18B20.','Kalibrasi terhadap Xiaomi TDS pen di 3 sampel.'],
 sim:{in:[{k:'tds',l:'TDS sebenarnya',min:0,max:1000,step:1,u:'ppm',def:200},{k:'t',l:'Suhu air',min:15,max:40,step:0.5,u:'°C',def:28},{k:'comp',l:'Kompensasi suhu di kode',opts:[[1,'pakai suhu aktual'],[0,'tetap 25 °C']],def:1}],
  out:(s,nz)=>{const g=v=>(133.42*v**3-255.86*v*v+857.39*v)*0.5;let lo=0,hi=2.6;for(let i=0;i<40;i++){const m=(lo+hi)/2;g(m)<s.tds?lo=m:hi=m}const v25=lo,v=v25*(1+0.02*(s.t-25))+nz(0.002),a=ADC(v),vb=a*5/1023,k=1+0.02*((+s.comp?s.t:25)-25),T=g(vb/k);
   return{rows:[['Tegangan A',fi(v,3)+' V'],['ADC',a],['TDS terhitung',fi(T,0)+' ppm'],['EC',fi(T*2,0)+' µS/cm'],['Error',fi(T-s.tds,0)+' ppm']],pins:[['A0',fi(v,3)+' V']],ser:`V=${f(vb,3)}  TDS=${f(T,0)} ppm  EC~${f(T*2,0)} uS/cm`,bar:{v:T,max:1000,l:'ppm'}}}}},

{id:'turbidity',nama:'Turbidity Sensor',sub:'Kekeruhan air (optik), analog/digital',cat:'analog',iface:'Analog',besaran:'Kekeruhan (NTU)',
 stok:{ada:true,info:'Turbidity sensor module, kode 28, 5 pcs, kotak 26'},
 spec:[['Tegangan','5 V, 40 mA'],['Output','analog 0 – 4,5 V (jernih ≈ 4,2 V) atau digital (sakelar di modul)'],['Rentang','0 – 3000 NTU (kurva pendekatan)'],['Prinsip','LED IR + fototransistor, cahaya yang diteruskan']],
 prinsip:`<p>Probe berisi LED inframerah dan fototransistor yang saling berhadapan. Partikel tersuspensi di air menghamburkan dan menyerap cahaya, sehingga <b>makin keruh, makin sedikit cahaya yang diterima</b> dan tegangan output turun. Air jernih memberi ±4,2 V.</p><p>Kurva tegangan ke NTU yang umum dipakai (DFRobot SEN0189) adalah polinomial orde dua dan hanya pendekatan. Cahaya luar juga memengaruhi pembacaan, jadi ukur di wadah gelap.</p>`,
 w:{mod:'Turbidity (SEN0189)',sub:'board adaptor',pins:[['V','5V'],['G','GND'],['A','A0']],note:'Geser sakelar di board ke posisi "A" (analog). Posisi "D" = output digital dengan ambang trimpot.'},
 lib:'',
 code:`// Turbidity: A -> A0 (sakelar modul di posisi A)
const int PIN_TURB = A0;

void setup() {
  Serial.begin(9600);
}

void loop() {
  long s = 0;
  for (int i = 0; i < 50; i++) { s += analogRead(PIN_TURB); delay(2); }
  float v = (s / 50.0) * 5.0 / 1023.0;
  float ntu;
  if (v < 2.5) ntu = 3000;                          // di luar kurva
  else ntu = -1120.4 * v * v + 5742.3 * v - 4352.9; // kurva SEN0189 (Vcc 5 V)
  if (ntu < 0) ntu = 0;
  Serial.print("V="); Serial.print(v, 2);
  Serial.print("  Kekeruhan="); Serial.print(ntu, 0); Serial.println(" NTU");
  delay(500);
}`,
 rumus:`<p><b>NTU = −1120,4V² + 5742,3V − 4352,9</b> untuk 2,5 ≤ V ≤ 4,2 V. Karena V jernih berbeda antar unit (dan bergantung Vcc), koreksi offset dulu: celup ke air suling, catat V<sub>0</sub>, lalu geser V sehingga V<sub>0</sub> setara 4,2 V. Kalibrasi lebih baik dengan larutan formazin standar atau turbidimeter.</p>`,
 masalah:['Air jernih terbaca ratusan NTU: offset tiap probe berbeda, lakukan koreksi air suling.','Berubah saat lampu ruangan menyala: tutup wadah dari cahaya luar.','Gelembung udara di celah probe membuat nilai melonjak.'],

  out:(s,nz)=>{const disc=5742.3**2-4*1120.4*(4352.9+s.ntu),v=disc>0?(5742.3+Math.sqrt(disc))/(2*1120.4):2.56;const vv=v+nz(0.003),a=ADC(vv),vb=a*5/1023;let N=vb<2.5?3000:-1120.4*vb*vb+5742.3*vb-4352.9;N=Math.max(0,N);
   return{rows:[['Tegangan A',fi(vv,3)+' V'],['ADC',a],['NTU terhitung',fi(N,0)]],pins:[['A0',fi(vv,2)+' V']],ser:`V=${f(vb)}  Kekeruhan=${f(N,0)} NTU`,curve:{x:s.ntu,fn:n=>{const d=5742.3**2-4*1120.4*(4352.9+n);return d>0?(5742.3+Math.sqrt(d))/(2*1120.4):2.56},x0:0,x1:3000,xl:'NTU',yl:'V'}}}}},

{id:'dht',nama:'DHT11 / DHT22 (AM2302)',sub:'Suhu & kelembapan, single-wire',cat:'digital',iface:'1-Wire (DHT)',besaran:'Suhu & kelembapan',
 stok:{ada:true,info:'DHT11: kode 3 (12 pcs) & kode 62 (20 pcs); DHT22: kode 7 (12 pcs); semua kotak 26'},
 spec:[['Tegangan','3,3 – 5,5 V'],['DHT11','0–50 °C ±2 °C; 20–90 %RH ±5 %; 1 Hz'],['DHT22','−40–80 °C ±0,5 °C; 0–100 %RH ±2–5 %; 0,5 Hz'],['Antarmuka','1 kabel data, 40 bit (RH 16 + T 16 + checksum 8)'],['Pull-up','4,7–10 kΩ (sudah ada di modul 3-pin)']],
 prinsip:`<p>Di dalamnya ada sensor kelembapan kapasitif (DHT22) atau resistif (DHT11) dan termistor NTC, plus mikrokontroler kecil yang mengubah hasil ukur menjadi data digital. Arduino memulai komunikasi dengan menarik jalur data LOW ≥ 1 ms (DHT22) / 18 ms (DHT11). Sensor lalu menjawab dengan <b>40 bit</b>: setiap bit diawali LOW 50 µs, lalu HIGH <b>26–28 µs = "0"</b> atau <b>70 µs = "1"</b>.</p><p>Byte terakhir adalah <b>checksum</b> = jumlah 4 byte pertama (8 bit bawah). Jika tidak cocok, data ditolak dan library mengembalikan NaN.</p>`,
 w:{mod:'DHT22 modul',sub:'(+ · out · −)',pins:[['VCC (+)','5V'],['DATA (out)','D2'],['GND (−)','GND']],note:'Sensor DHT 4-pin tanpa modul: pasang resistor pull-up 10 kΩ dari DATA ke VCC; pin 3 tidak dipakai.'},
 lib:'DHT sensor library (Adafruit) + Adafruit Unified Sensor',
 code:`#include <DHT.h>          // "DHT sensor library" (Adafruit) + "Adafruit Unified Sensor"
#define PIN_DHT 2
#define TIPE    DHT22       // ganti DHT11 bila memakai DHT11
DHT dht(PIN_DHT, TIPE);

void setup() {
  Serial.begin(9600);
  dht.begin();
}

void loop() {
  delay(2000);                              // DHT22 min 2 s, DHT11 min 1 s
  float h = dht.readHumidity();
  float t = dht.readTemperature();          // Celsius
  if (isnan(h) || isnan(t)) {
    Serial.println("Gagal baca DHT (cek wiring/pull-up)");
    return;
  }
  float hi = dht.computeHeatIndex(t, h, false);
  Serial.print("T=");  Serial.print(t, 1);
  Serial.print(" C  RH="); Serial.print(h, 1);
  Serial.print(" %  Heat index="); Serial.print(hi, 1); Serial.println(" C");
}`,
 rumus:`<p>DHT22: <b>RH = (byte0·256 + byte1)/10</b>, <b>T = ((byte2 & 0x7F)·256 + byte3)/10</b> (bit 15 = tanda minus). DHT11: RH = byte0, T = byte2 (+ byte3/10 pada versi baru). Checksum = (b0+b1+b2+b3) & 0xFF. Kalibrasi kelembapan bisa diperiksa dengan larutan garam jenuh NaCl (75,3 %RH pada 25 °C).</p>`,
 masalah:['Selalu NaN: pin salah, pull-up tidak ada, atau dibaca lebih cepat dari 2 s.','Kabel > 20 m: turunkan pull-up ke 4,7 kΩ dan pakai kabel twisted.','Kelembapan 99 % terus: sensor pernah terkena air/kondensasi; keringkan dan rekondisi.'],

  out:(s,nz)=>{const H=Math.round(s.h*10),Tt=Math.round(Math.abs(s.t)*10)|(s.t<0?0x8000:0),b=[H>>8,H&255,Tt>>8,Tt&255];const cs=(b[0]+b[1]+b[2]+b[3])&255;const all=[...b,cs];
   const bits=all.flatMap(x=>bin(x,8).split('').map(Number));const e=[[0,1],[0,0],[1000,1],[1030,0],[1110,1],[1190,0]];let t=1190;bits.forEach(bt=>{e.push([t,0]);t+=50;e.push([t,1]);t+=bt?70:27;e.push([t,0])});e.push([t+50,1]);
   const tc=Math.round(s.t*10)/10,hc=Math.round(s.h*10)/10,a=(c=>c)(0),hi=tc;
   return{rows:[['Byte RH',hex(b[0])+' '+hex(b[1])+' = '+H],['Byte T',hex(b[2])+' '+hex(b[3])+(s.t<0?' (bit tanda=1)':'')],['Checksum',hex(cs)+' = ('+b.join('+')+') & 0xFF'],['Hasil',fi(tc,1)+' °C, '+fi(hc,1)+' %RH']],pins:[['D2','frame 40 bit setiap 2 s']],ser:`T=${f(tc,1)} C  RH=${f(hc,1)} %`,
   wave:{d:[{n:'DATA',e,c:'--sig1'}],t0:0,t1:Math.min(t+60,1190+16*125),unit:'µs',note:'Ditampilkan: start (host LOW 1 ms), respons sensor, dan 16 bit pertama (RH).'}}}}},

 stok:{ada:false,info:'Tidak tercatat di stok BHP'},

 prinsip:`<p>DS18B20 mengukur suhu dengan dua osilator: satu stabil dan satu sangat bergantung suhu, lalu menghitung selisih frekuensinya. Hasilnya disimpan sebagai bilangan 16 bit <b>komplemen dua</b> dengan resolusi 1/16 °C.</p><p>Protokol <b>1-Wire</b> memakai satu jalur data open-drain dengan pull-up 4,7 kΩ. Setiap sensor punya alamat ROM 64 bit, sehingga puluhan sensor bisa berbagi satu pin Arduino. Ini cocok untuk mengukur suhu di beberapa titik tangki atau pipa.</p>`,
 w:{mod:'DS18B20',sub:'merah · kuning · hitam',pins:[['VDD (merah)','5V'],['DQ (kuning)','D2'],['GND (hitam)','GND']],res:{a:1,b:0,v:'4,7 kΩ'},note:'Resistor pull-up 4,7 kΩ antara DQ dan VDD wajib (modul adaptor biasanya sudah ada).'},
 lib:'OneWire + DallasTemperature',
 code:`#include <OneWire.h>
#include <DallasTemperature.h>   // library: OneWire + DallasTemperature
#define PIN_ONEWIRE 2
OneWire ow(PIN_ONEWIRE);
DallasTemperature sensor(&ow);

void setup() {
  Serial.begin(9600);
  sensor.begin();
  sensor.setResolution(12);                 // 0,0625 C, konversi 750 ms
  Serial.print("Jumlah sensor: ");
  Serial.println(sensor.getDeviceCount());
}

void loop() {
  sensor.requestTemperatures();             // semua sensor mulai konversi
  float t = sensor.getTempCByIndex(0);
  if (t == DEVICE_DISCONNECTED_C) {
    Serial.println("Sensor tidak terdeteksi (cek pull-up 4k7)");
  } else {
    Serial.print("T="); Serial.print(t, 4); Serial.println(" C");
  }
  delay(1000);
}`,

   return{rows:[['Raw (komplemen dua)',hex(r16,4)+' = '+bin(r16,16).replace(/(\d{4})/g,'$1 ').trim()],['Suhu',fi(T,4)+' °C'],['Langkah',fi(st/16,4)+' °C'],['Waktu konversi',conv+' ms']],pins:[['D2','1-Wire (open drain + 4k7)']],ser:`T=${f(T,4)} C`,bar:{v:T+55,max:180,l:'°C (−55…125)'}}}}},

 stok:{ada:true,info:'Modul ultrasonic HY-SRF05/HC-SR04, kode 9, 15 pcs, kotak 26'},
 spec:[['Tegangan','5 V, 15 mA'],['Rentang','2 – 400 cm (efektif 3 – 250 cm)'],['Resolusi','≈ 0,3 cm'],['Sudut','≈ 15°'],['Trigger','pulsa HIGH ≥ 10 µs'],['Echo','HIGH selama waktu tempuh pulang-pergi']],
 prinsip:`<p>Setelah menerima pulsa trigger 10 µs, modul memancarkan 8 siklus ultrasonik 40 kHz, lalu pin Echo HIGH sampai pantulan diterima. Lebar pulsa Echo = waktu tempuh <b>pergi + pulang</b>, sehingga <b>jarak = t·c/2</b>.</p><p>Cepat rambat bunyi bergantung suhu: <b>c ≈ 331,3 + 0,606·T m/s</b> (≈ 348 m/s pada 28 °C). Mengabaikan suhu memberi error ±2 %. Objek lunak (kain, busa) atau miring menyerap atau membelokkan gelombang, sehingga tidak terdeteksi.</p>`,
 w:{mod:'HC-SR04',sub:'VCC · Trig · Echo · GND',pins:[['VCC','5V'],['Trig','D9'],['Echo','D10'],['GND','GND']]},
 lib:'',
 code:`// HC-SR04: Trig -> D9, Echo -> D10
const int PIN_TRIG = 9, PIN_ECHO = 10;
float suhu = 28.0;            // C, koreksi cepat rambat bunyi

void setup() {
  Serial.begin(9600);
  pinMode(PIN_TRIG, OUTPUT);
  pinMode(PIN_ECHO, INPUT);
}

void loop() {
  digitalWrite(PIN_TRIG, LOW);  delayMicroseconds(2);
  digitalWrite(PIN_TRIG, HIGH); delayMicroseconds(10);   // trigger 10 us
  digitalWrite(PIN_TRIG, LOW);
  unsigned long durasi = pulseIn(PIN_ECHO, HIGH, 30000UL); // timeout 30 ms (~5 m)
  float c = 331.3 + 0.606 * suhu;                          // m/s
  float jarak = durasi * c / 20000.0;                      // cm (pulang-pergi)
  Serial.print("Echo="); Serial.print(durasi); Serial.print(" us  Jarak=");
  if (durasi == 0) Serial.println("di luar jangkauan");
  else { Serial.print(jarak, 1); Serial.println(" cm"); }
  delay(100);                                              // jeda >= 60 ms
}`,

 stok:{ada:true,info:'Kode 1, 15 pcs, kotak 28'},

 prinsip:`<p>Sensor piroelektrik berisi dua elemen yang membaca radiasi inframerah (panas tubuh ±9–10 µm). Lensa Fresnel membagi area pandang menjadi zona-zona. Ketika orang <b>bergerak</b> melintasi zona, kedua elemen menerima panas bergantian sehingga muncul sinyal selisih. Benda panas yang diam tidak terdeteksi.</p><p>IC BISS0001 mengolah sinyal itu menjadi output HIGH selama waktu tunda Tx. Pada mode <b>H (retrigger)</b>, gerakan baru memperpanjang HIGH. Pada mode <b>L</b>, output turun setelah Tx lalu ada waktu blok ±2,5 s.</p>`,
 w:{mod:'HC-SR501',sub:'VCC · OUT · GND',pins:[['VCC','5V'],['OUT','D2'],['GND','GND']]},
 lib:'',
 code:`// PIR HC-SR501: OUT -> D2
const int PIN_PIR = 2, PIN_LED = 13;
bool sebelumnya = false;

void setup() {
  Serial.begin(9600);
  pinMode(PIN_PIR, INPUT);
  pinMode(PIN_LED, OUTPUT);
  Serial.println("Stabilisasi PIR 30 s...");
  delay(30000);
  Serial.println("Siap");
}

void loop() {
  bool gerak = digitalRead(PIN_PIR) == HIGH;
  digitalWrite(PIN_LED, gerak);
  if (gerak && !sebelumnya) {
    Serial.print(millis() / 1000); Serial.println(" s: GERAKAN terdeteksi");

  if (!gerak && sebelumnya) {

  sebelumnya = gerak;                       // deteksi tepi (edge)

}`,

{id:'linetracker',nama:'Line Tracker 3/5 Channel (TCRT5000 / BFD-1000)',sub:'Deteksi garis hitam untuk robot line follower',cat:'digital',iface:'Digital (multi)',besaran:'Posisi garis',
 stok:{ada:true,info:'3 channel, kode 1, 40 pcs, kotak 19; BFD-1000 5 channel, E-237, 25 pcs, kotak 16'},
 spec:[['Tegangan','3,3 – 5 V'],['Kanal','3 (S1–S3) atau 5 (S1–S5)'],['Jarak optimal','1 – 2 cm dari lantai'],['Output','digital per kanal (cek polaritas modul)'],['BFD-1000','+ sensor tabrak (CLP) dan proximity (NEAR)']],
 prinsip:`<p>Setiap kanal adalah pasangan LED IR dan fototransistor (TCRT5000) yang menghadap lantai. Lantai putih memantulkan banyak IR, garis hitam menyerapnya. Komparator mengubah tiap kanal menjadi 0/1.</p><p>Posisi garis dihitung sebagai <b>rata-rata berbobot</b> kanal yang aktif (bobot −2…+2). Nilai ini menjadi <b>error</b> untuk pengendali P/PID yang mengatur selisih kecepatan motor kiri dan kanan.</p>`,
 w:{mod:'BFD-1000 (5 ch)',sub:'S1 kiri … S5 kanan',pins:[['VCC','5V'],['GND','GND'],['S1','D2'],['S2','D3'],['S3','D4'],['S4','D5'],['S5','D6']],note:'Versi 3 channel: OUT1–OUT3 ke D2–D4; ubah array PIN_S dan BOBOT menjadi {-1,0,1}.'},
 lib:'',
 code:`// Line tracker 5 kanal: S1..S5 -> D2..D6
const int PIN_S[5] = {2, 3, 4, 5, 6};     // S1 (kiri) ... S5 (kanan)
const int BOBOT[5] = {-2, -1, 0, 1, 2};
const bool AKTIF_HIGH = true;             // 1 = di atas garis hitam (cek modul!)

void setup() {
  Serial.begin(9600);
  for (int i = 0; i < 5; i++) pinMode(PIN_S[i], INPUT);
}

void loop() {
  int jumlah = 0, aktif = 0;
  Serial.print("Sensor: ");
  for (int i = 0; i < 5; i++) {
    int b = digitalRead(PIN_S[i]);
    if (!AKTIF_HIGH) b = !b;
    Serial.print(b);
    if (b) { jumlah += BOBOT[i]; aktif++; }
  }
  if (aktif == 0) {
    Serial.println("  -> garis hilang");
  } else {
    float err = (float)jumlah / aktif;      // -2 (kiri) .. +2 (kanan)
    Serial.print("  error="); Serial.println(err, 2);
  }
  delay(100);
}`,
 rumus:`<p><b>error = Σ(bobot<sub>i</sub>·s<sub>i</sub>)/Σs<sub>i</sub></b>. Kendali P: <b>v<sub>kiri</sub> = v<sub>0</sub> + K<sub>p</sub>·error</b>, <b>v<sub>kanan</sub> = v<sub>0</sub> − K<sub>p</sub>·error</b>. Bila semua kanal 0, simpan error terakhir untuk memutar balik mencari garis.</p>`,
 masalah:['Polaritas terbalik (putih = 1): set AKTIF_HIGH = false.','Kanal tidak seragam: atur trimpot tiap kanal di atas putih dan hitam.','Terlalu tinggi dari lantai (> 3 cm): pantulan lemah.'],
 tugas:['Line follower kontrol P dengan L298N (stok kode 19) dan motor gearbox.','Tambahkan I dan D, lalu bandingkan waktu tempuh satu putaran.','Deteksi persimpangan (semua kanal = 1) untuk menghitung checkpoint.'],

{id:'irspeed',nama:'IR Speed Sensor (opto-interrupter)',sub:'Celah optik + piringan encoder',cat:'digital',iface:'Interrupt (pulsa)',besaran:'Kecepatan putar',
 stok:{ada:true,info:'IR speed sensor photo opto interruptor, E-242, 15 pcs, kotak 22'},
 spec:[['Tegangan','3,3 – 5 V'],['Celah','5 mm (U-slot, mis. MOCH22A)'],['Output','DO (LM393), pulsa tiap lubang piringan'],['Piringan','umumnya 20 lubang']],
 prinsip:`<p>LED IR dan fototransistor saling berhadapan dalam celah U. Piringan berlubang dipasang pada poros motor. Setiap lubang yang lewat meneruskan cahaya sehingga output membentuk <b>pulsa</b>. Frekuensi pulsa sebanding dengan kecepatan: <b>rpm = f·60/N</b>, dengan N = jumlah lubang.</p><p>Pulsa dihitung dengan <b>interrupt</b> (pin 2/3 pada Uno) agar tidak ada yang terlewat, lalu jumlahnya dibaca setiap 1 s (metode frekuensi). Untuk kecepatan rendah, metode periode (mengukur waktu antar pulsa) lebih teliti.</p>`,
 w:{mod:'Speed sensor',sub:'U-slot + LM393',pins:[['VCC','5V'],['GND','GND'],['DO','D2']],note:'Pin D2 = INT0, D3 = INT1 (pin interrupt eksternal Arduino Uno).'},
 lib:'',
 code:`// IR speed sensor: DO -> D2 (INT0)
const int PIN_DO = 2;
const int SLOT = 20;                    // jumlah lubang piringan
volatile unsigned long pulsa = 0;

void hitung() { pulsa++; }              // ISR: sesingkat mungkin

void setup() {
  Serial.begin(9600);
  pinMode(PIN_DO, INPUT);
  attachInterrupt(digitalPinToInterrupt(PIN_DO), hitung, RISING);
}

void loop() {
  static unsigned long t0 = millis();
  if (millis() - t0 >= 1000) {
    noInterrupts();
    unsigned long p = pulsa; pulsa = 0;  // baca & nolkan secara atomik
    interrupts();
    float rpm = p * 60.0 / SLOT;
    Serial.print("Pulsa/s="); Serial.print(p);
    Serial.print("  Kecepatan="); Serial.print(rpm, 1); Serial.println(" rpm");
    t0 += 1000;
  }
}`,
 rumus:`<p><b>rpm = (pulsa per detik)·60/N</b>. Resolusi metode frekuensi dengan jendela 1 s = 60/N rpm (3 rpm untuk N = 20). Metode periode: <b>rpm = 60/(N·T<sub>pulsa</sub>)</b>, lebih baik di bawah ±100 rpm.</p>`,
 masalah:['Hitungan berlipat: getaran tepi lubang (bouncing). Tambah filter waktu minimal antar pulsa di ISR.','Tidak menghitung: variabel tidak volatile atau pin bukan 2/3.','Nilai rpm "loncat" 3 rpm: batas resolusi metode frekuensi.'],
 tugas:['Ukur kurva PWM (0–255) terhadap rpm motor DC melalui L298N.','Bandingkan metode frekuensi dan metode periode di kecepatan rendah.','Kontrol kecepatan PI motor DC dengan umpan balik sensor ini.'],

   return{rows:[['Frekuensi pulsa',fi(fr,1)+' Hz'],['Periode',isFinite(T)?fi(T,2)+' ms':'–'],['Pulsa dalam 1 s',p],['rpm terhitung',fi(rE,1)+' (resolusi '+fi(60/s.n,1)+')']],pins:[['D2',fr?'pulsa '+fi(fr,0)+' Hz':'tetap']],ser:`Pulsa/s=${p}  Kecepatan=${f(rE,1)} rpm`,
   wave:{d:[{n:'DO',e:pulseTrain(fr/1000,0.5,50),c:'--sig1'}],t0:0,t1:50,unit:'ms'}}}}},

 spec:[['Tegangan','5 – 30 V DC'],['Output','NPN NO, open collector (LOW saat magnet dekat)'],['Jarak','≈ 10 mm (magnet neodymium)'],['Kabel','coklat +, biru −, hitam sinyal'],['Frekuensi','hingga ±100 Hz']],
 prinsip:`<p>Elemen <b>efek Hall</b> menghasilkan tegangan bila ditembus medan magnet. IC di dalamnya membandingkan tegangan Hall dengan ambang lalu menyalakan transistor NPN. Karena outputnya <b>open collector</b>, pin harus diberi pull-up (pakai <code>INPUT_PULLUP</code>). Output LOW berarti magnet terdeteksi, dan LED di ujung sensor menyala.</p><p>Sensor ini banyak dipakai sebagai limit switch tanpa kontak, penghitung putaran (magnet di roda), atau deteksi posisi silinder pneumatik.</p>`,
 w:{mod:'NJK-5002C',sub:'coklat · hitam · biru',pins:[['Coklat (+)','5V'],['Hitam (sinyal)','D2'],['Biru (−)','GND']],note:'Bila catu sensor 12–24 V, output open collector tetap aman ke Arduino asalkan memakai pull-up ke 5 V (bukan ke 12 V).'},
 lib:'',
 code:`// NJK-5002C: hitam -> D2 (open collector, aktif LOW)
const int PIN_HALL = 2;
volatile unsigned long n = 0;

void isr() { n++; }

void setup() {
  Serial.begin(9600);
  pinMode(PIN_HALL, INPUT_PULLUP);         // wajib: output open collector
  attachInterrupt(digitalPinToInterrupt(PIN_HALL), isr, FALLING);
}

void loop() {
  bool dekat = digitalRead(PIN_HALL) == LOW;
  Serial.print("Magnet: "); Serial.print(dekat ? "TERDETEKSI" : "-");
  Serial.print("   Jumlah deteksi: "); Serial.println(n);
  delay(300);
}`,
 rumus:`<p>Untuk kecepatan: tempel magnet di roda, lalu <b>rpm = 60/T</b> (T = periode antar deteksi). Kecepatan linear <b>v = π·D·rpm/60</b>.</p>`,

{id:'lpd3806',nama:'Rotary Encoder LPD3806-600BM',sub:'Encoder optik inkremental 600 PPR, A/B',cat:'digital',iface:'Interrupt (quadrature)',besaran:'Posisi & kecepatan sudut',
 stok:{ada:true,info:'Kode 51, 37 pcs, kotak 37'},
 spec:[['Tegangan','5 – 24 V DC'],['Resolusi','600 pulsa/putaran per kanal (2400 count dengan dekode ×4)'],['Output','A, B open collector NPN (perlu pull-up)'],['Kecepatan maks','5000 rpm'],['Kabel','merah +, hitam −, hijau A, putih B, shield']],
 prinsip:`<p>Piringan berkisi dengan 600 celah di antara LED dan fotodetektor menghasilkan dua sinyal kotak <b>A dan B yang bergeser 90°</b> (quadrature). Urutan tepi A–B menunjukkan <b>arah putar</b>, dan jumlah tepi menunjukkan <b>sudut</b>.</p><p>Dengan menghitung setiap tepi naik dan turun di A dan B (dekode ×4), satu putaran = 2400 count = 0,15° per count. Pada Uno dipakai dua interrupt (D2, D3). Kecepatan dihitung dari selisih count per selang waktu.</p>`,
 w:{mod:'LPD3806-600BM',sub:'5 kabel',pins:[['Merah (+)','5V'],['Hitam (−)','GND'],['Hijau (A)','D2'],['Putih (B)','D3']],note:'Output open collector: INPUT_PULLUP cukup untuk kabel pendek; untuk kabel > 1 m pakai pull-up eksternal 2,2–4,7 kΩ ke 5 V. Shield ke GND.'},
 lib:'',
 code:`// LPD3806-600BM: A (hijau) -> D2, B (putih) -> D3
const int PIN_A = 2, PIN_B = 3;
const long PPR = 600, CPR = PPR * 4;     // dekode x4 = 2400 count/putaran
volatile long hitung = 0;

void isrA() { if (digitalRead(PIN_A) == digitalRead(PIN_B)) hitung++; else hitung--; }
void isrB() { if (digitalRead(PIN_A) != digitalRead(PIN_B)) hitung++; else hitung--; }

void setup() {
  Serial.begin(115200);
  pinMode(PIN_A, INPUT_PULLUP);          // output open collector
  pinMode(PIN_B, INPUT_PULLUP);
  attachInterrupt(digitalPinToInterrupt(PIN_A), isrA, CHANGE);
  attachInterrupt(digitalPinToInterrupt(PIN_B), isrB, CHANGE);
}

void loop() {
  static long lalu = 0;
  static unsigned long t0 = millis();
  if (millis() - t0 >= 100) {
    noInterrupts(); long c = hitung; interrupts();
    float sudut = (c % CPR) * 360.0 / CPR;
    float rpm = (c - lalu) * 600.0 / CPR;  // count per 100 ms -> rpm
    lalu = c; t0 += 100;
    Serial.print("Count="); Serial.print(c);
    Serial.print("  Sudut="); Serial.print(sudut, 1);
    Serial.print(" deg  Kecepatan="); Serial.print(rpm, 1); Serial.println(" rpm");
  }
}`,
 rumus:`<p><b>Sudut = count·360/2400</b>; <b>rpm = Δcount/Δt·60/2400</b>. Pada 5000 rpm, frekuensi tepi ×4 = 200 kHz, terlalu cepat untuk interrupt Uno (praktis ±20–40 kHz). Untuk kecepatan tinggi, pakai dekode ×1 (RISING di A saja) atau mikrokontroler dengan hardware encoder (STM32 timer).</p>`,
 masalah:['Count acak saat diam: pull-up kurang atau noise, pakai pull-up eksternal dan kabel shield.','Arah terbalik: tukar A dan B.','Hitungan hilang di kecepatan tinggi: batas interrupt, kurangi dekode atau pakai MCU lain.'],
 tugas:['Ukur sudut putar poros dan tampilkan dalam derajat.','Encoder sebagai umpan balik kontrol posisi motor DC (PID posisi).','Ukur kecepatan maksimum yang masih terbaca benar dengan ×4 vs ×1.'],

  out:(s,nz)=>{const fA=Math.abs(s.rpm)*600/60,dir=s.rpm>=0?1:-1,T=fA?1/fA*1000:0,tEnd=T?Math.min(5*T,50):10;const A=fA?pulseTrain(fA/1000,0.5,tEnd):[[0,0]],sh=T/4*dir,B=fA?pulseTrain(fA/1000,0.5,tEnd+T,0).map(([t,l])=>[t+sh,l]).filter(([t])=>t>=0):[[0,0]];if(fA&&B[0][0]>0)B.unshift([0,dir>0?0:1]);
   return{rows:[['Frekuensi A',fi(fA,0)+' Hz'],['Tepi ×4 per detik',fi(fA*4,0)+' /s'],['Count per 100 ms',fi(s.rpm*2400/600,0)],['Arah',s.rpm>0?'B tertinggal 90° (CW)':s.rpm<0?'B mendahului (CCW)':'diam']],pins:[['D2 (A)',fA?fi(fA,0)+' Hz':'tetap'],['D3 (B)','90° geser']],ser:`Count=${Math.round(s.rpm*2400/60*((performance.now()/1000)%60))}  Kecepatan=${f(s.rpm,1)} rpm`,
   wave:{d:[{n:'A',e:A,c:'--sig1'},{n:'B',e:B,c:'--sig2'}],t0:0,t1:tEnd,unit:'ms'}}}}},

{id:'yfs201',nama:'YF-S201 Flow Sensor',sub:'Sensor aliran air turbin + Hall',cat:'digital',iface:'Interrupt (pulsa)',besaran:'Debit air',
 stok:{ada:false,info:'Tidak tercatat di stok BHP'},
 spec:[['Tegangan','5 – 18 V'],['Rentang','1 – 30 L/menit'],['Faktor','f (Hz) = 7,5 × Q (L/menit); ≈ 450 pulsa/L'],['Akurasi','±10 % (tanpa kalibrasi)'],['Ulir','G 1/2"'],['Kabel','merah +, hitam −, kuning pulsa']],
 prinsip:`<p>Air memutar turbin kecil yang dilengkapi magnet. Sensor <b>Hall</b> di luar ruang air mendeteksi magnet yang lewat, sehingga setiap putaran menghasilkan pulsa. Frekuensi pulsa sebanding dengan debit, dan jumlah pulsa sebanding dengan volume total.</p><p>Faktor 7,5 (atau 450 pulsa/L) hanyalah nilai nominal. Akurasi meningkat banyak setelah kalibrasi dengan gelas ukur. Sensor ini relevan untuk praktikum WTP: mengukur debit permeat dan konsentrat RO skala kecil.</p>`,
 w:{mod:'YF-S201',sub:'merah · kuning · hitam',pins:[['Merah (+)','5V'],['Kuning (pulsa)','D2'],['Hitam (−)','GND']]},
 lib:'',
 code:`// YF-S201: kuning -> D2 (INT0)
const int PIN_FLOW = 2;
volatile unsigned long pulsa = 0;
float totalLiter = 0;

void isr() { pulsa++; }

void setup() {
  Serial.begin(9600);
  pinMode(PIN_FLOW, INPUT_PULLUP);
  attachInterrupt(digitalPinToInterrupt(PIN_FLOW), isr, FALLING);
}

void loop() {
  static unsigned long t0 = millis();
  if (millis() - t0 >= 1000) {
    noInterrupts(); unsigned long p = pulsa; pulsa = 0; interrupts();
    float debit = p / 7.5;                 // L/menit (f = 7,5 x Q)
    totalLiter += p / 450.0;               // ~450 pulsa per liter
    Serial.print("f=");        Serial.print(p);
    Serial.print(" Hz  Debit="); Serial.print(debit, 2);
    Serial.print(" L/min  Total="); Serial.print(totalLiter, 3); Serial.println(" L");
    t0 += 1000;
  }
}`,
 rumus:`<p><b>Q (L/menit) = f/7,5</b>; <b>V (L) = N<sub>pulsa</sub>/450</b>. Kalibrasi: alirkan air ke gelas ukur 1 L, hitung pulsa total N, lalu ganti 450 dengan N.</p>`,

 tugas:['Kalibrasi faktor pulsa/liter dengan gelas ukur 1 L (3 kali ulang).','Meteran air digital dengan total liter disimpan di EEPROM.','Ukur recovery RO mini: debit permeat/debit umpan dengan 2 sensor.'],

{id:'mpu9250',nama:'MPU9250 / MPU6050 (IMU)',sub:'Akselerometer + giroskop (+ magnetometer), I2C',cat:'digital',iface:'I2C',besaran:'Kemiringan & rotasi',
 stok:{ada:true,info:'9DOF MPU9250 (GY-9250), kode 12, 10 pcs, kotak 20'},
 spec:[['Tegangan modul','3,3 – 5 V (regulator di modul GY)'],['Alamat I2C','0x68 (AD0 = GND) / 0x69'],['Akselerometer','±2/4/8/16 g, 16 bit (16384 LSB/g @±2 g)'],['Giroskop','±250…2000 °/s (131 LSB/(°/s) @±250)'],['MPU9250','+ magnetometer AK8963 (alamat 0x0C)'],['WHO_AM_I','0x71 (MPU9250), 0x68 (MPU6050)']],
 prinsip:`<p>Di dalam chip terdapat struktur <b>MEMS</b> berukuran mikrometer. Massa kecil yang tergantung pegas bergeser karena percepatan, dan pergeserannya terbaca sebagai perubahan kapasitansi (akselerometer). Giroskop memanfaatkan <b>gaya Coriolis</b> pada massa yang bergetar ketika chip berputar.</p><p>Saat diam, akselerometer hanya membaca gravitasi, jadi sudut kemiringan bisa dihitung: <b>roll = atan2(a<sub>y</sub>, a<sub>z</sub>)</b>, <b>pitch = atan2(−a<sub>x</sub>, √(a<sub>y</sub>²+a<sub>z</sub>²))</b>. Akselerometer peka getaran, sedangkan giroskop drift. Keduanya digabung dengan complementary/Kalman filter.</p>`,
 w:{mod:'GY-9250',sub:'MPU9250',pins:[['VCC','5V'],['GND','GND'],['SCL','A5'],['SDA','A4']],note:'Pada Uno, SDA = A4 dan SCL = A5 (juga tersedia di header dekat AREF). Modul GY sudah punya pull-up I2C.'},
 lib:'Wire (bawaan)',
 code:`#include <Wire.h>
const uint8_t MPU = 0x68;                  // AD0 = GND

int16_t baca16() {                         // baca 2 byte big-endian
  uint8_t h = Wire.read();
  uint8_t l = Wire.read();
  return (int16_t)((h << 8) | l);
}

void setup() {
  Serial.begin(115200);
  Wire.begin();
  Wire.beginTransmission(MPU);             // PWR_MGMT_1 = 0 -> bangunkan
  Wire.write(0x6B); Wire.write(0x00);
  Wire.endTransmission();
  Wire.beginTransmission(MPU);             // baca WHO_AM_I
  Wire.write(0x75);
  Wire.endTransmission(false);
  Wire.requestFrom(MPU, (uint8_t)1);
  uint8_t id = Wire.read();
  Serial.print("WHO_AM_I = 0x"); Serial.print(id, HEX);
  Serial.println(id == 0x71 ? " (MPU9250)" : id == 0x68 ? " (MPU6050)" : " (?)");
}

void loop() {
  Wire.beginTransmission(MPU);
  Wire.write(0x3B);                        // ACCEL_XOUT_H
  Wire.endTransmission(false);
  Wire.requestFrom(MPU, (uint8_t)14);      // accel(6) temp(2) gyro(6)
  int16_t ax = baca16(), ay = baca16(), az = baca16();
  baca16();                                // suhu (tidak dipakai)
  int16_t gx = baca16(), gy = baca16(), gz = baca16();
  float axg = ax / 16384.0, ayg = ay / 16384.0, azg = az / 16384.0;   // +-2 g
  float roll  = atan2(ayg, azg) * 180.0 / PI;
  float pitch = atan2(-axg, sqrt(ayg * ayg + azg * azg)) * 180.0 / PI;
  Serial.print("a[g]="); Serial.print(axg, 2); Serial.print(',');
  Serial.print(ayg, 2);  Serial.print(',');   Serial.print(azg, 2);
  Serial.print("  gz="); Serial.print(gz / 131.0, 1);
  Serial.print(" dps  Roll="); Serial.print(roll, 1);
  Serial.print("  Pitch=");    Serial.println(pitch, 1);
  delay(100);
}`,
 rumus:`<p>Skala: <b>a (g) = raw/16384</b> (±2 g), <b>ω (°/s) = raw/131</b> (±250 °/s). Complementary filter: <b>θ = 0,98·(θ + ω·Δt) + 0,02·θ<sub>accel</sub></b>. Kalibrasi bias giroskop: rata-ratakan 500 sampel saat diam lalu kurangkan.</p>`,
 masalah:['Semua nilai 0 / −1: belum dibangunkan (register 0x6B) atau alamat bukan 0x68 (cek AD0). Jalankan I2C scanner.','Sudut bergetar saat motor jalan: akselerometer menangkap getaran, pakai complementary filter.','Yaw (heading) tidak bisa dari akselerometer: perlu magnetometer AK8963 atau integrasi giro (drift).'],
 tugas:['Waterpass digital: tampilkan roll/pitch dan buzzer saat datar ±1°.','Complementary filter dan bandingkan dengan sudut accel murni saat diguncang.','Kalibrasi bias giroskop dan ukur drift yaw selama 5 menit.'],
 sim:{in:[{k:'roll',l:'Roll',min:-90,max:90,step:1,u:'°',def:15},{k:'pitch',l:'Pitch',min:-80,max:80,step:1,u:'°',def:-10},{k:'gz',l:'Rotasi sumbu Z',min:-250,max:250,step:1,u:'°/s',def:0}],
  out:(s,nz)=>{const r=s.roll*Math.PI/180,p=s.pitch*Math.PI/180,ax=-Math.sin(p),ay=Math.sin(r)*Math.cos(p),az=Math.cos(r)*Math.cos(p),R=v=>Math.round(cl((v+nz(0.004))*16384,-32768,32767)),rx=R(ax),ry=R(ay),rz=R(az),G=Math.round(cl(s.gz*131,-32768,32767));
   const axg=rx/16384,ayg=ry/16384,azg=rz/16384,roll=Math.atan2(ayg,azg)*180/Math.PI,pitch=Math.atan2(-axg,Math.hypot(ayg,azg))*180/Math.PI;
   return{rows:[['ACCEL raw X/Y/Z',rx+' / '+ry+' / '+rz],['a (g)',fi(axg,3)+' / '+fi(ayg,3)+' / '+fi(azg,3)],['GYRO_Z raw',G+' → '+fi(G/131,1)+' °/s'],['Roll / Pitch terhitung',fi(roll,1)+'° / '+fi(pitch,1)+'°']],pins:[['A4 (SDA)','I2C data'],['A5 (SCL)','I2C clock 100 kHz']],ser:`a[g]=${f(axg)},${f(ayg)},${f(azg)}  gz=${f(G/131,1)} dps  Roll=${f(roll,1)}  Pitch=${f(pitch,1)}`,tilt:{roll:s.roll,pitch:s.pitch}}}}},

 code:`#include <Wire.h>

 lib:'TinyGPSPlus (Mikal Hart) + SoftwareSerial',
 code:`#include <SoftwareSerial.h>
#include <TinyGPS++.h>               // library: "TinyGPSPlus" by Mikal Hart
SoftwareSerial gpsSerial(4, 3);      // RX=D4 (ke TX GPS), TX=D3 (ke RX GPS)
TinyGPSPlus gps;

void setup() {
  Serial.begin(115200);
  gpsSerial.begin(9600);
  Serial.println("Menunggu fix GPS (di luar ruangan, 30 s - 5 menit)...");
}

void loop() {
  while (gpsSerial.available()) gps.encode(gpsSerial.read());
  static unsigned long t0 = 0;
  if (millis() - t0 > 1000) {
    t0 = millis();
    if (gps.location.isValid()) {
      Serial.print("Lat=");  Serial.print(gps.location.lat(), 6);
      Serial.print("  Lon="); Serial.print(gps.location.lng(), 6);
      Serial.print("  Sat="); Serial.print(gps.satellites.value());
      Serial.print("  Alt="); Serial.print(gps.altitude.meters(), 1);
      Serial.println(" m");
    } else {
      Serial.print("Belum fix, karakter diterima: ");
      Serial.println(gps.charsProcessed());
    }
  }
}`,

 lib:'HX711 (Bogdan Necula / bogde)',
 code:`#include <HX711.h>               // library: "HX711" by Bogdan Necula (bogde)
const int PIN_DT = 3, PIN_SCK = 2;
HX711 timbangan;
float faktor = 420.0;              // count per gram (hasil kalibrasi)

void setup() {
  Serial.begin(9600);
  timbangan.begin(PIN_DT, PIN_SCK);
  Serial.println("Kosongkan timbangan, tare...");
  delay(1000);
  timbangan.set_scale(faktor);
  timbangan.tare(20);              // nol-kan (rata-rata 20 sampel)
  Serial.println("Siap. Ketik 'c' untuk kalibrasi dengan beban 1000 g.");
}

void loop() {
  if (Serial.available() && Serial.read() == 'c') {
    Serial.println("Letakkan beban acuan 1000 g, tunggu 5 s...");
    delay(5000);
    long raw = timbangan.get_value(20);      // sudah dikurangi tare
    faktor = raw / 1000.0;
    timbangan.set_scale(faktor);
    Serial.print("Faktor kalibrasi baru = "); Serial.println(faktor);
  }
  float g = timbangan.get_units(10);
  Serial.print("Berat="); Serial.print(g, 1); Serial.println(" g");
  delay(300);
}`,

const $=s=>document.querySelector(s);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const NZ=s=>s*gauss();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const BYID={};SENSORS.forEach(s=>BYID[s.id]=s);
const POWER=['5V','GND','3.3V','VIN'];
function ifGroup(s){const i=s.iface;if(/I2C/.test(i))return'I2C';if(/1-Wire/.test(i))return'1-Wire';if(/UART/.test(i))return'UART';if(/SPI|Serial 2/.test(i))return'SPI / serial sinkron';if(/Interrupt|Pulsa/i.test(i))return'Pulsa / interrupt';if(/Analog/.test(i))return'Analog (ADC)';return'Digital I/O'}
const pinSummary=s=>s.w.pins.filter(p=>!POWER.includes(p[1])).map(p=>p[0].replace(/ \(.*\)/,'')+'→'+p[1]).join(', ');

/* ---------- theme ---------- */

function applyTheme(){if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);$('#themeBtn').textContent='Tema: '+({auto:'otomatis',light:'terang',dark:'gelap'})[theme]}
$('#themeBtn').onclick=()=>{theme=theme==='auto'?'light':theme==='light'?'dark':'auto';LS.set('ls_theme',theme);applyTheme()};
applyTheme();

(function(){const gs=[...new Set(SENSORS.map(ifGroup))];$('#ifSel').innerHTML='<option value="">Semua antarmuka</option>'+gs.map(g=>`<option>${g}</option>`).join('')})();

function match(s){if(F.cat!=='all'&&s.cat!==F.cat)return false;if(F.ifg&&ifGroup(s)!==F.ifg)return false;if(F.stok&&!s.stok.ada)return false;if(F.q){const h=(s.nama+' '+s.sub+' '+s.besaran+' '+s.iface+' '+pinSummary(s)).toLowerCase();return F.q.split(/\s+/).every(w=>h.includes(w))}return true}
let cur={page:'dasar',tab:'sim'};
function renderNav(){
  const L=SENSORS.filter(match);let h=`<div class="special"><a href="#dasar" class="${cur.page==='dasar'?'on':''}"><span class="dot" style="background:var(--acc2)"></span><span class="nm">Dasar Arduino &amp; ADC</span></a><a href="#tabel" class="${cur.page==='tabel'?'on':''}"><span class="dot" style="background:var(--acc2)"></span><span class="nm">Tabel perbandingan</span></a></div>`;
  ['analog','digital'].forEach(c=>{const g=L.filter(s=>s.cat===c);if(!g.length)return;h+=`<div class="grp">${c==='analog'?'Sensor analog':'Sensor digital'} (${g.length})</div>`;
    g.forEach(s=>{h+=`<a href="#${s.id}" class="${cur.page===s.id?'on':''}" title="${esc(s.nama)}"><span class="dot ${s.stok.ada?'ok':''}"></span><span class="nm">${esc(s.nama)}</span><span class="if">${esc(ifShort(s))}</span></a>`})});
  if(!L.length)h+='<div class="cnt">Tidak ada sensor yang cocok.</div>';
