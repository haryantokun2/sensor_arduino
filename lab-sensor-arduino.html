function ifShort(s){const g=ifGroup(s);return{'Analog (ADC)':'ADC','I2C':'I2C','1-Wire':'1W','UART':'UART','SPI / serial sinkron':'SPI','Pulsa / interrupt':'INT','Digital I/O':'DIO'}[g]}

/* ---------- routing ---------- */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));const [p,t]=h.split('/');
  if(p&&(BYID[p]||p==='dasar'||p==='tabel')){cur.page=p;if(t&&['sim','wiring','prog','kal'].includes(t))cur.tab=t}
  else cur.page=LS.get('ls_page','dasar');
  if(!(BYID[cur.page]||cur.page==='dasar'||cur.page==='tabel'))cur.page='dasar';
  LS.set('ls_page',cur.page);renderNav();renderMain();
}
function setHash(){const h='#'+cur.page+(BYID[cur.page]?'/'+cur.tab:'');try{history.replaceState(null,'',h)}catch(e){location.hash=h}}
window.addEventListener('hashchange',route);

/* ---------- sim state ---------- */
const STATE={};
function getState(sen){if(!STATE[sen.id]){const s={};sen.sim.in.forEach(i=>{if(!i.btn)s[i.k]=i.def});STATE[sen.id]={s,st:{},log:[],pause:false}}return STATE[sen.id]}
function fmtIn(i,v){if(i.opts){const o=i.opts.find(o=>String(o[0])===String(v));return o?o[1]:v}let x=i.log?Math.pow(10,v):v;const d=i.log?(x<10?2:x<100?1:0):(i.step<0.01?4:i.step<0.1?2:i.step<1?1:0);return Number(x).toLocaleString('id-ID',{maximumFractionDigits:d,minimumFractionDigits:i.log?0:d})+(i.u?' '+i.u:'')}

/* ---------- main render ---------- */
let timer=null,lastOut=null;
function renderMain(){
  clearInterval(timer);timer=null;
  const m=$('#main');
  if(cur.page==='dasar'){m.innerHTML=dasarHTML();hl(m);window.scrollTo&&0;return}
  if(cur.page==='tabel'){m.innerHTML=tabelHTML();m.querySelectorAll('tr.r').forEach(r=>r.onclick=()=>{location.hash='#'+r.dataset.id+'/sim'});return}
  const s=BYID[cur.page];
  m.innerHTML=`<div class="card">
   <div class="shead"><div style="min-width:0;flex:1 1 320px"><h2>${esc(s.nama)}</h2><div class="sub">${esc(s.sub)}</div>
     <div class="badges"><span class="bd ${s.cat==='analog'?'an':'dg'}">${s.cat==='analog'?'Analog':'Digital'}</span><span class="bd">${esc(s.iface)}</span><span class="bd">${esc(s.besaran)}</span>${s.lib?`<span class="bd">Library: ${esc(s.lib)}</span>`:'<span class="bd">Tanpa library</span>'}</div></div>
     <div class="stok ${s.stok.ada?'ok':'no'}"><b>${s.stok.ada?'✓ Ada di stok BHP':'Tidak ada di stok BHP'}</b>${esc(s.stok.info)}</div></div>
   <div class="tabs" role="tablist">${[['sim','Simulasi & Prinsip'],['wiring','Wiring'],['prog','Program'],['kal','Kalibrasi & Troubleshooting']].map(([k,l])=>`<button class="tab ${cur.tab===k?'on':''}" data-t="${k}" role="tab">${l}</button>`).join('')}</div>
   <div id="pane"></div></div>`;
  m.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur.tab=b.dataset.t;setHash();renderMain()});
  const P=$('#pane');
  if(cur.tab==='sim')renderSim(s,P);
  else if(cur.tab==='wiring')P.innerHTML=wiringHTML(s);
  else if(cur.tab==='prog'){P.innerHTML=progHTML(s);P.querySelector('#cpy').onclick=()=>copy(s.code,P.querySelector('#cpy'))}
  else P.innerHTML=kalHTML(s);
}

function renderSim(s,P){
  const S=getState(s);
  const ctl=s.sim.in.map(i=>{
    if(i.btn)return`<div class="ctl"><div class="lb"><span>${esc(i.l)}</span><span></span></div><button class="btn pri" type="button" data-btn="${i.k}" style="margin-top:4px;width:100%">${esc(i.btn)}</button></div>`;
    if(i.opts)return`<div class="ctl"><div class="lb"><span>${esc(i.l)}</span><span></span></div><select data-k="${i.k}">${i.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(S.s[i.k])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
    return`<div class="ctl"><div class="lb"><span>${esc(i.l)}</span><span data-v="${i.k}">${fmtIn(i,S.s[i.k])}</span></div><input type="range" data-k="${i.k}" min="${i.min}" max="${i.max}" step="${i.step}" value="${S.s[i.k]}" aria-label="${esc(i.l)}"></div>`}).join('');
  P.innerHTML=`<div class="g2">
    <div class="box"><h3>Masukan (kondisi fisik)</h3>${ctl}<h3 style="margin-top:14px">Pembacaan Arduino</h3><table class="kv" id="rows"></table><div class="pins" id="pins"></div></div>
    <div class="box"><h3 id="visT">Visualisasi</h3><canvas id="vis"></canvas><div id="visX"></div><div class="cap" id="visCap"></div></div>
   </div>
   <div class="serial" style="margin-top:14px"><div class="bar"><b>Serial Monitor (simulasi)</b><span id="baud"></span><button type="button" id="sPause">${S.pause?'Lanjut':'Jeda'}</button><button type="button" id="sClr">Hapus</button></div><pre id="ser" aria-live="off"></pre></div>
   <div class="g2" style="margin-top:14px"><div class="prose box"><h3>Prinsip kerja</h3>${s.prinsip}</div><div class="box"><h3>Spesifikasi ringkas</h3><table class="kv">${s.spec.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div></div>`;
  $('#baud').textContent=(/Serial\.begin\((\d+)\)/.exec(s.code)||[0,'9600'])[1]+' baud';
  P.querySelectorAll('input[type=range]').forEach(el=>el.oninput=()=>{const i=s.sim.in.find(x=>x.k===el.dataset.k);S.s[i.k]=+el.value;P.querySelector(`[data-v="${i.k}"]`).textContent=fmtIn(i,S.s[i.k]);tick(s,false)});
  P.querySelectorAll('select[data-k]').forEach(el=>el.onchange=()=>{const i=s.sim.in.find(x=>x.k===el.dataset.k);const o=i.opts.find(o=>String(o[0])===el.value);S.s[i.k]=o?o[0]:el.value;tick(s,true)});
  P.querySelectorAll('[data-btn]').forEach(el=>el.onclick=()=>{S.st.ev=S.st.ev||[];S.st.ev.push(performance.now()/1000);tick(s,true)});
  $('#sPause').onclick=()=>{S.pause=!S.pause;$('#sPause').textContent=S.pause?'Lanjut':'Jeda'};
  $('#sClr').onclick=()=>{S.log=[];drawSer(S)};
  drawSer(S);tick(s,true);
  timer=setInterval(()=>tick(s,true),500);
}
function tick(s,log){
  if(!$('#rows'))return;
  const S=getState(s);let o;
  try{o=s.sim.out(S.s,NZ,S.st)}catch(e){console.error(e);return}
  lastOut=o;
  $('#rows').innerHTML=o.rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('');
  $('#pins').innerHTML=(o.pins||[]).map(p=>`<span class="pin">${esc(p[0])}: <i>${esc(p[1])}</i></span>`).join('');
  drawVis(o);
  if(log&&!S.pause&&o.ser){const t=new Date(),ts=t.toTimeString().slice(0,8)+'.'+String(t.getMilliseconds()).padStart(3,'0');S.log.push([ts,o.ser]);if(S.log.length>200)S.log.splice(0,S.log.length-200);drawSer(S)}
}
function drawSer(S){const el=$('#ser');if(!el)return;const atB=el.scrollHeight-el.scrollTop-el.clientHeight<30;el.innerHTML=S.log.map(([t,l])=>`<span class="ts">${t} -&gt; </span>${esc(l)}`).join('\n');if(atB)el.scrollTop=el.scrollHeight}

/* ---------- canvas visuals ---------- */
function prep(cv,h){const dpr=window.devicePixelRatio||1,w=cv.clientWidth||cv.parentNode.clientWidth||300;cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.font='12px "JetBrains Mono",monospace';return{c,w,h}}
const col=v=>v&&v.startsWith('--')?css(v):v;
function drawVis(o){
  const cv=$('#vis');if(!cv)return;const X=$('#visX'),cap=$('#visCap'),T=$('#visT');X.innerHTML='';cap.textContent='';cv.hidden=false;
  if(o.wave){T.textContent=o.wave.d?'Diagram waktu sinyal digital':'Bentuk gelombang di pin analog';return o.wave.d?drawDig(cv,o.wave,cap):drawAna(cv,o.wave)}
  if(o.curve){T.textContent='Kurva karakteristik sensor';return drawCurve(cv,o.curve)}
  if(o.xy){T.textContent='Posisi tuas';return drawXY(cv,o.xy)}
  if(o.line){T.textContent='Tampak atas: sensor di atas garis';return drawLine(cv,o.line)}
  if(o.tilt){T.textContent='Orientasi modul';return drawTilt(cv,o.tilt)}
  if(o.clock){T.textContent='Jam dari register RTC';return drawClock(cv,o.clock)}
  if(o.mono){T.textContent='Data mentah UART dari GPS';cv.hidden=true;X.innerHTML=`<div class="mono-box">${esc(o.mono)}</div><div class="cap">Kalimat $GPGGA: waktu UTC, lintang, bujur, kualitas fix, jumlah satelit, HDOP, ketinggian. TinyGPS++ menguraikannya otomatis.</div>`;return}
  if(o.bar){T.textContent='Nilai terukur';return drawBar(cv,o.bar)}
  cv.hidden=true;
}
function axes(c,x0,y0,x1,y1){c.strokeStyle=css('--line');c.lineWidth=1;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0,y1);c.lineTo(x1,y1);c.stroke()}
function nice(v){if(v===0)return'0';return Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2)}
function drawBar(cv,b){const{c,w,h}=prep(cv,150);const p=Math.max(0,Math.min(1,b.v/b.max)),x0=16,x1=w-16,y=60,bh=28;
  c.fillStyle=css('--line');roundRect(c,x0,y,x1-x0,bh,8);c.fill();c.fillStyle=css('--acc');roundRect(c,x0,y,Math.max(8,(x1-x0)*p),bh,8);c.fill();
  c.fillStyle=css('--mute');c.textAlign='left';c.fillText('0',x0,y+bh+18);c.textAlign='right';c.fillText(String(b.max),x1,y+bh+18);c.textAlign='center';c.fillText(b.l,(x0+x1)/2,y+bh+18);
  c.fillStyle=css('--ink');c.font='700 22px "JetBrains Mono",monospace';c.fillText(nice(b.v),(x0+x1)/2,y-16);}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawAna(cv,W){const{c,w,h}=prep(cv,220);const L=44,R=w-10,Tp=12,B=h-28;axes(c,L,Tp,R,B);
  const ys=v=>B-(v-W.ylo)/(W.yhi-W.ylo)*(B-Tp);c.fillStyle=css('--mute');c.textAlign='right';
  for(let k=0;k<=5;k++){const v=W.ylo+(W.yhi-W.ylo)*k/5;c.fillText(v.toFixed(1),L-6,ys(v)+4);c.strokeStyle=css('--line');c.globalAlpha=.5;c.beginPath();c.moveTo(L,ys(v));c.lineTo(R,ys(v));c.stroke();c.globalAlpha=1}
  for(let k=0;k<=5;k++){const t=W.t1*k/5;c.textAlign=k===5?'right':'center';c.fillText(nice(t)+(k===5?' '+W.unit:''),L+(R-L)*k/5,B+16)}
  W.a.forEach(s=>{c.strokeStyle=col(s.c||'--sig1');c.lineWidth=2;c.beginPath();s.y.forEach((v,i)=>{const x=L+(R-L)*i/(s.y.length-1);i?c.lineTo(x,ys(v)):c.moveTo(x,ys(v))});c.stroke()});
  c.textAlign='left';c.fillStyle=col(W.a[0].c);c.fillText(W.a[0].n,L+6,Tp+12);}
function drawDig(cv,W,cap){const n=W.d.length,lane=46,{c,w,h}=prep(cv,n*lane+34);const L=62,R=w-10;const t0=W.t0||0,t1=W.t1,xs=t=>L+(t-t0)/(t1-t0)*(R-L);
  W.d.forEach((ch,k)=>{const yb=12+k*lane+lane-14,yt=yb-24;c.fillStyle=css('--mute');c.textAlign='right';c.fillText(ch.n,L-8,yb-8);
    c.strokeStyle=css('--line');c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();c.moveTo(L,yb);c.lineTo(R,yb);c.stroke();c.setLineDash([]);
    c.strokeStyle=col(ch.c||'--sig1');c.lineWidth=1.8;c.beginPath();let lv=ch.e.length?ch.e[0][1]:0,px=L;c.moveTo(L,lv?yt:yb);
    for(const [t,l] of ch.e){if(t<t0)continue;if(t>t1)break;const x=xs(t);c.lineTo(x,lv?yt:yb);c.lineTo(x,l?yt:yb);lv=l;px=x}c.lineTo(R,lv?yt:yb);c.stroke()});
  const yA=12+n*lane;c.fillStyle=css('--mute');for(let k=0;k<=5;k++){const t=t0+(t1-t0)*k/5;c.textAlign=k===5?'right':k===0?'left':'center';c.fillText(nice(t),xs(t),yA+4)}c.textAlign='right';c.fillText(W.unit,R,yA+18);
  if(W.note)cap.textContent=W.note;else if(W.live)cap.textContent='Jendela 30 s terakhir, diperbarui setiap 0,5 s. Tekan tombol berulang kali untuk melihat perbedaan mode H dan L.';}
function drawCurve(cv,C){const{c,w,h}=prep(cv,230);const L=44,R=w-12,Tp=12,B=h-30;const N=200,pts=[];let lo=Infinity,hi=-Infinity;for(let i=0;i<=N;i++){const x=C.x0+(C.x1-C.x0)*i/N,y=C.fn(x);pts.push([x,y]);lo=Math.min(lo,y);hi=Math.max(hi,y)}lo=Math.min(0,lo);hi=hi*1.08;
  const xs=x=>L+(x-C.x0)/(C.x1-C.x0)*(R-L),ys=y=>B-(y-lo)/(hi-lo)*(B-Tp);axes(c,L,Tp,R,B);c.fillStyle=css('--mute');c.textAlign='right';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;c.fillText(v.toFixed(1),L-6,ys(v)+4)}c.textAlign='center';for(let k=0;k<=5;k++){const v=C.x0+(C.x1-C.x0)*k/5;c.fillText(nice(v),xs(v),B+16)}
  c.textAlign='right';c.fillText(C.xl,R,B+28);c.textAlign='left';c.fillText(C.yl,L+4,Tp+10);
  c.strokeStyle=css('--sig1');c.lineWidth=2;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(xs(x),ys(y)):c.moveTo(xs(x),ys(y)));c.stroke();
  const yv=C.fn(C.x);c.strokeStyle=css('--sig2');c.setLineDash([4,4]);c.lineWidth=1;c.beginPath();c.moveTo(xs(C.x),B);c.lineTo(xs(C.x),ys(yv));c.lineTo(L,ys(yv));c.stroke();c.setLineDash([]);c.fillStyle=css('--sig2');c.beginPath();c.arc(xs(C.x),ys(yv),5,0,7);c.fill();}
function drawXY(cv,P){const{c,w,h}=prep(cv,230);const S=Math.min(w-20,h-20),x0=(w-S)/2,y0=(h-S)/2;c.strokeStyle=css('--line');c.lineWidth=1;c.strokeRect(x0,y0,S,S);c.beginPath();c.moveTo(x0+S/2,y0);c.lineTo(x0+S/2,y0+S);c.moveTo(x0,y0+S/2);c.lineTo(x0+S,y0+S/2);c.stroke();
  c.setLineDash([3,3]);c.strokeRect(x0+S/2-S*0.025,y0+S/2-S*0.025,S*0.05,S*0.05);c.setLineDash([]);const px=x0+S/2+P.x/100*S/2,py=y0+S/2-P.y/100*S/2;c.fillStyle=css('--acc');c.beginPath();c.arc(px,py,10,0,7);c.fill();c.fillStyle=css('--mute');c.fillText('X',x0+S-12,y0+S/2-6);c.fillText('Y',x0+S/2+6,y0+12);}
function drawLine(cv,Ln){const{c,w,h}=prep(cv,200);const mm=x=>w/2+x*(w-40)/130;c.fillStyle='#f3f1ea';c.fillRect(0,0,w,h);c.fillStyle='#151515';c.fillRect(mm(Ln.x-Ln.w/2),0,mm(Ln.x+Ln.w/2)-mm(Ln.x-Ln.w/2),h);
  c.fillStyle='rgba(20,110,120,.85)';roundRect(c,mm(-38),70,mm(38)-mm(-38),60,10);c.fill();
  Ln.bits.forEach((b,i)=>{const x=mm((i-2)*15);c.fillStyle=b?'#ff5a3c':'#d6e4e0';c.beginPath();c.arc(x,100,9,0,7);c.fill();c.fillStyle=Math.abs((i-2)*15-Ln.x)<Ln.w/2?'#fff':'#333';c.textAlign='center';c.fillText('S'+(i+1),x,148)});
  c.fillStyle='#555';c.textAlign='left';c.fillText('lantai putih',8,16);c.textAlign='center';c.fillStyle='#fff';c.fillText('garis',mm(Ln.x),h-10);}
function drawTilt(cv,T){const{c,w,h}=prep(cv,230);const r=Math.min(90,(h-30)/2),cx=w/2>r*2+40?w/4+10:w/2,cy=h/2;
  c.strokeStyle=css('--line');c.lineWidth=2;c.beginPath();c.arc(cx,cy,r,0,7);c.stroke();c.beginPath();c.arc(cx,cy,r*0.12,0,7);c.stroke();c.beginPath();c.moveTo(cx-r,cy);c.lineTo(cx+r,cy);c.moveTo(cx,cy-r);c.lineTo(cx,cy+r);c.lineWidth=1;c.stroke();
  const bx=cx+Math.sin(T.roll*Math.PI/180)*r*0.85,by=cy-Math.sin(T.pitch*Math.PI/180)*r*0.85;c.fillStyle=css('--acc');c.globalAlpha=.85;c.beginPath();c.arc(bx,by,r*0.14,0,7);c.fill();c.globalAlpha=1;c.fillStyle=css('--mute');c.textAlign='center';c.fillText('waterpass (roll, pitch)',cx,h-4);
  if(w/2>r*2+40){const cx2=w*0.72,L=Math.min(w*0.22,120);c.save();c.translate(cx2,cy);c.rotate(-T.roll*Math.PI/180);c.fillStyle=css('--board');roundRect(c,-L,-14,2*L,28,6);c.fill();c.fillStyle='#fff';c.fillText('GY-9250',0,4);c.restore();c.strokeStyle=css('--line');c.setLineDash([4,4]);c.beginPath();c.moveTo(cx2-L-10,cy);c.lineTo(cx2+L+10,cy);c.stroke();c.setLineDash([]);c.fillStyle=css('--mute');c.fillText('tampak depan (roll)',cx2,h-4)}}
function drawClock(cv,K){const{c,w,h}=prep(cv,230);const r=95,cx=w/2,cy=h/2;c.strokeStyle=css('--line');c.lineWidth=3;c.beginPath();c.arc(cx,cy,r,0,7);c.stroke();
  for(let i=0;i<60;i++){const a=i/60*2*Math.PI,l=i%5?4:10;c.lineWidth=i%5?1:2;c.strokeStyle=css(i%5?'--line':'--mute');c.beginPath();c.moveTo(cx+Math.sin(a)*(r-4),cy-Math.cos(a)*(r-4));c.lineTo(cx+Math.sin(a)*(r-4-l),cy-Math.cos(a)*(r-4-l));c.stroke()}

  hand(((K.h%12)+K.m/60)/12*2*Math.PI,r*0.5,5,css('--ink'));hand((K.m+K.s/60)/60*2*Math.PI,r*0.75,3,css('--ink'));hand(K.s/60*2*Math.PI,r*0.85,1.5,css('--acc2'));c.lineCap='butt';}

/* ---------- wiring SVG ---------- */
const TOP=['SCL','SDA','AREF','GND','D13','D12','D11','D10','D9','D8',null,'D7','D6','D5','D4','D3','D2','D1','D0'];
const BOT=['NC','IOREF','RST','3.3V','5V','GND','GND','VIN',null,'A0','A1','A2','A3','A4','A5'];
function pinPos(){const P={};let x=104;TOP.forEach(n=>{if(n){(P[n]=P[n]||[]).push([x,112,'t'])}x+=17});x=150;BOT.forEach(n=>{if(n){(P[n]=P[n]||[]).push([x,298,'b'])}x+=17});return P}
function wcol(u,mp){if(u==='5V'||u==='VIN')return'--w5v';if(u==='GND')return'--wgnd';if(u==='3.3V')return'--w33';if(/SDA/.test(mp)||u==='A4'&&/SDA/.test(mp))return'--wsda';if(/SCL/.test(mp))return'--wscl';if(u[0]==='A')return'--wa';return'--wd'}
function wiringSVG(s){
  const P=pinPos(),pins=s.w.pins,n=pins.length,mx=590,mw=130,py0=205-(n-1)*14,mh=(n-1)*28+56,my=py0-28;
  let gndUsed=0;const used={};
  const wires=pins.map((p,i)=>{const u=p[1];let cand=P[u]||[];let pos;if(u==='GND'){const g=[P.GND[1],P.GND[2],P.GND[0]];pos=g[gndUsed%3];gndUsed++}else pos=cand[0];return{i,mp:p[0],u,pos,y:py0+i*28,c:wcol(u,p[0])}});
  const top=wires.filter(w=>w.pos&&w.pos[2]==='t').sort((a,b)=>b.pos[0]-a.pos[0]),bot=wires.filter(w=>w.pos&&w.pos[2]==='b').sort((a,b)=>b.pos[0]-a.pos[0]);
  top.forEach((w,j)=>w.lane=96-j*9);bot.forEach((w,j)=>w.lane=316+j*9);
  // vertical x: order by module y so verticals don't cross unnecessarily
  wires.forEach(w=>{w.vx=0});const ups=top.slice().sort((a,b)=>a.y-b.y),dns=bot.slice().sort((a,b)=>b.y-a.y);
  ups.forEach((w,k)=>w.vx=562-(top.length-1-top.indexOf(w))*0-k*0);
  // simple: verticals for top wires: higher module pin (smaller y) -> closer to module? assign by lane order
  top.forEach((w,j)=>w.vx=560-j*10);bot.forEach((w,j)=>w.vx=560-j*10-(top.length?5:0));
  let g=`<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" role="img" aria-label="Diagram wiring ${esc(s.nama)} ke Arduino Uno">`;
  // board
  g+=`<rect x="40" y="110" width="400" height="200" rx="12" fill="var(--board)"/><rect x="40" y="110" width="400" height="200" rx="12" fill="none" stroke="var(--board2)" stroke-width="2"/>`;
  g+=`<rect x="22" y="132" width="56" height="44" rx="4" fill="#b8bec3" stroke="#7e868c"/><text x="50" y="190" font-size="9" fill="var(--mute)" text-anchor="middle">USB</text>`;
  g+=`<rect x="22" y="238" width="48" height="40" rx="4" fill="#222"/><text x="46" y="292" font-size="9" fill="var(--mute)" text-anchor="middle">DC 7–12V</text>`;
  g+=`<rect x="230" y="210" width="150" height="34" rx="3" fill="#1d1f20"/><text x="305" y="231" font-size="10" fill="#cfd5d8" text-anchor="middle">ATmega328P</text>`;
  g+=`<text x="230" y="190" font-size="20" font-weight="700" fill="#ffffff" font-family="Plus Jakarta Sans,system-ui,sans-serif">ARDUINO UNO</text>`;
  g+=`<text x="300" y="160" font-size="9" fill="#cde8e6" text-anchor="middle">DIGITAL (PWM ~)</text><text x="330" y="268" font-size="9" fill="#cde8e6" text-anchor="middle">ANALOG IN</text><text x="205" y="268" font-size="9" fill="#cde8e6" text-anchor="middle">POWER</text>`;
  const usedPins=new Set(wires.filter(w=>w.pos).map(w=>w.pos[0]+','+w.pos[1]));
  const hdr=(arr,x0,y,lblY,rot)=>{let x=x0,o='';arr.forEach(n=>{if(n){const u=usedPins.has(x+','+y);o+=`<rect x="${x-6}" y="${y-6}" width="12" height="12" rx="2" fill="#16181a"/><circle cx="${x}" cy="${y}" r="3" fill="${u?'#ffd54a':'#555'}"/>`;
    o+=`<text transform="translate(${x+3},${lblY}) rotate(-90)" font-size="8.5" fill="${u?'#ffffff':'#bfe1de'}" font-weight="${u?700:400}" text-anchor="${rot}">${n.replace(/^D(?=\d)/,'')}</text>`}x+=17});return o};
  g+=hdr(TOP,104,112,124,'end')+hdr(BOT,150,298,286,'start');
  // module
  g+=`<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" rx="10" fill="var(--panel)" stroke="var(--acc)" stroke-width="2"/>`;
  g+=`<text x="${mx+mw/2}" y="${my-22}" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle" font-family="Plus Jakarta Sans,system-ui,sans-serif">${esc(s.w.mod)}</text><text x="${mx+mw/2}" y="${my-8}" font-size="9.5" fill="var(--mute)" text-anchor="middle">${esc(s.w.sub||'')}</text>`;
  // wires
  wires.forEach(w=>{if(!w.pos)return;const [px,py,side]=w.pos;const d=`M${mx} ${w.y} H${w.vx} V${w.lane} H${px} V${py}`;g+=`<path d="${d}" fill="none" stroke="var(${w.c})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/><circle cx="${px}" cy="${py}" r="3.4" fill="var(${w.c})"/>`});
  wires.forEach(w=>{g+=`<circle cx="${mx}" cy="${w.y}" r="4" fill="var(${w.c})"/><text x="${mx+10}" y="${w.y+4}" font-size="10.5" fill="var(--ink)">${esc(w.mp)}</text>`});
  if(s.w.res){const a=wires[s.w.res.a],b=wires[s.w.res.b],x=576,y1=Math.min(a.y,b.y),y2=Math.max(a.y,b.y);g+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="var(--ink)" stroke-width="1.5"/><rect x="${x-5}" y="${(y1+y2)/2-9}" width="10" height="18" fill="#e8d8b0" stroke="var(--ink)"/><circle cx="${x}" cy="${y1}" r="2.5" fill="var(--ink)"/><circle cx="${x}" cy="${y2}" r="2.5" fill="var(--ink)"/><text x="${x-9}" y="${(y1+y2)/2+4}" font-size="10" fill="var(--ink)" text-anchor="end">${esc(s.w.res.v)}</text>`}
  return g+'</svg>';
}
const WDESC={'--w5v':'Catu 5 V','--wgnd':'Ground','--w33':'Catu 3,3 V','--wa':'Sinyal analog (ADC)','--wd':'Sinyal digital','--wsda':'I2C data (SDA)','--wscl':'I2C clock (SCL)'};
function pinNote(u,mp){if(u==='A4')return'SDA I2C (juga header SDA dekat AREF)';if(u==='A5')return'SCL I2C (juga header SCL dekat AREF)';if(u==='D2')return'INT0, bisa interrupt';if(u==='D3')return'INT1 / PWM, bisa interrupt';if(/^D(5|6|9|10|11)$/.test(u))return'PWM ~';if(u[0]==='A')return'ADC 10 bit';if(u==='5V')return'maks ±400 mA dari USB';if(u==='3.3V')return'maks 50 mA';if(u==='GND')return'ground bersama';return'I/O digital'}

const KW=/\b(void|int|long|unsigned|float|double|bool|char|const|uint8_t|int16_t|uint16_t|uint32_t|byte|volatile|static|return|if|else|for|while|do|true|false|HIGH|LOW|INPUT|OUTPUT|INPUT_PULLUP|RISING|FALLING|CHANGE|PI|DEFAULT|INTERNAL|break|continue|sizeof)\b/;
function hlC(src){const re=/(\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])')|(#\s*\w+)|\b(0x[0-9A-Fa-f]+|\d+(?:\.\d+)?(?:e-?\d+)?[UL]*)\b|\b([A-Za-z_]\w*)\b(?=\s*\()|\b([A-Za-z_]\w*)\b/g;let o='',last=0,m;
  while((m=re.exec(src))){o+=esc(src.slice(last,m.index));const t=esc(m[0]);if(m[1])o+=`<span class="tk-c">${t}</span>`;else if(m[2])o+=`<span class="tk-s">${t}</span>`;else if(m[3])o+=`<span class="tk-p">${t}</span>`;else if(m[4])o+=`<span class="tk-n">${t}</span>`;else if(m[5])o+=KW.test(m[5])?`<span class="tk-k">${t}</span>`:`<span class="tk-f">${t}</span>`;else o+=KW.test(m[6])?`<span class="tk-k">${t}</span>`:t;last=re.lastIndex}return o+esc(src.slice(last))}

function progHTML(s){return`<div class="codewrap"><div class="cbar"><span>${esc(s.id)}.ino · Arduino Uno${s.lib?' · library: '+esc(s.lib):''}</span><button class="btn pri" id="cpy" type="button">Salin kode</button></div><pre>${hlC(s.code)}</pre></div>
 <div class="g2" style="margin-top:14px"><div class="box"><h3>Langkah uji</h3><ul class="lst"><li>Rangkai sesuai tab <b>Wiring</b>, cek ulang polaritas catu sebelum USB dicolok.</li>${s.lib?`<li>Pasang library <b>${esc(s.lib)}</b> lewat Library Manager.</li>`:''}<li>Board: <i>Arduino Uno</i>, pilih port COM yang sesuai, lalu Upload.</li><li>Buka Serial Monitor pada baud <b>${(/Serial\.begin\((\d+)\)/.exec(s.code)||[0,'9600'])[1]}</b>. Keluaran yang diharapkan sama formatnya dengan Serial Monitor di tab Simulasi.</li></ul></div>
 <div class="box"><h3>Contoh keluaran</h3><div class="mono-box" id="exOut">${esc((()=>{const S=getState(s);try{return s.sim.out(S.s,()=>0,S.st).ser||''}catch(e){return''}})())}</div><div class="cap">Dihasilkan dari kondisi masukan simulasi saat ini.</div></div></div>`}
function copy(t,b){const done=()=>{b.textContent='Tersalin ✓';setTimeout(()=>b.textContent='Salin kode',1500)};try{navigator.clipboard.writeText(t).then(done,()=>fb())}catch(e){fb()}function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}}

/* ---------- dasar ---------- */
function dasarHTML(){return`<div class="card ref">
<h2 style="margin:0 0 12px">Dasar Arduino Uno untuk membaca sensor</h2>
<div class="g2"><div class="box prose"><h3>Sensor analog vs digital</h3><p><b>Sensor analog</b> mengeluarkan tegangan kontinu yang sebanding dengan besaran fisik. Arduino Uno membacanya dengan ADC 10 bit di pin A0–A5: <b>ADC = V·1023/V<sub>ref</sub></b>, dengan V<sub>ref</sub> default = 5 V, sehingga 1 langkah ≈ 4,89 mV.</p><p><b>Sensor digital</b> sudah mengubah hasil ukurnya menjadi data biner di dalam modul, lalu mengirimkannya lewat protokol: logika HIGH/LOW, lebar pulsa, frekuensi pulsa, 1-Wire, I2C, SPI, atau UART. Keuntungannya: tahan noise kabel dan biasanya sudah terkalibrasi pabrik.</p></div>
<div class="box"><h3>Batas listrik Arduino Uno</h3><table class="kv"><tr><td>Tegangan I/O</td><td>0–5 V (jangan &gt; 5,5 V di pin mana pun)</td></tr><tr><td>Arus per pin I/O</td><td>20 mA disarankan, 40 mA maksimum absolut</td></tr><tr><td>Total arus semua I/O</td><td>≤ 200 mA</td></tr><tr><td>Pin 5V (dari USB)</td><td>±400 mA (dibatasi polyfuse 500 mA)</td></tr><tr><td>Pin 3.3V</td><td>±50 mA</td></tr><tr><td>Interrupt eksternal</td><td>D2 (INT0), D3 (INT1)</td></tr><tr><td>PWM</td><td>D3, D5, D6, D9, D10, D11</td></tr><tr><td>I2C</td><td>A4 = SDA, A5 = SCL</td></tr><tr><td>SPI</td><td>D10 SS, D11 MOSI, D12 MISO, D13 SCK</td></tr><tr><td>UART</td><td>D0 RX, D1 TX (dipakai USB)</td></tr><tr><td>analogRead</td><td>±112 µs per sampel (±8,9 kS/s)</td></tr></table></div></div>

<h3>Kalkulator ADC</h3>
<div class="box"><div class="g2"><div><div class="ctl"><div class="lb"><span>Tegangan masukan</span><span id="adcV"></span></div><input type="range" id="adcIn" min="0" max="5" step="0.001" value="2.5" aria-label="Tegangan masukan"></div><div class="ctl"><div class="lb"><span>V referensi</span><span></span></div><select id="adcRef"><option value="5">DEFAULT 5 V</option><option value="1.1">INTERNAL 1,1 V</option><option value="3.3">EXTERNAL 3,3 V (AREF)</option></select></div></div><table class="kv" id="adcOut"></table></div></div>

<h3>Pull-up, aktif LOW, dan open collector</h3>
<div class="g2"><div class="box prose"><p>Pin input yang tidak terhubung ke apa pun akan <b>mengambang</b> dan membaca 0/1 acak. Sakelar, tombol, dan output <b>open collector/open drain</b> (NJK-5002C, encoder LPD3806, YF-S201, 1-Wire, I2C) hanya bisa menarik ke GND, jadi perlu resistor <b>pull-up</b> ke 5 V. Arduino punya pull-up internal ±20–50 kΩ: <code>pinMode(pin, INPUT_PULLUP)</code>.</p><p>Akibatnya logika menjadi <b>aktif LOW</b>: LOW = ditekan/terdeteksi. Untuk kabel panjang atau bus cepat, pakai pull-up eksternal yang lebih kecil (4,7 kΩ untuk 1-Wire/I2C, 2,2 kΩ untuk encoder).</p></div>
<div class="box prose"><h3>Modul 3,3 V di Arduino 5 V</h3><p>Banyak chip modern (BMP280, MPU9250, NEO-6M) bekerja pada 3,3 V. Modul "GY-" biasanya sudah membawa regulator dan pull-up, tetapi periksa dulu:</p><ul class="lst"><li>Ada regulator (IC 3 kaki 662K/LM6206) → VCC boleh 5 V.</li><li>Tidak ada regulator → VCC <b>wajib</b> 3,3 V.</li><li>Pin input modul yang menerima sinyal dari Arduino (RX GPS, SDA/SCL tanpa pull-up 3,3 V) → pakai level shifter atau pembagi 1 kΩ/2 kΩ.</li></ul></div></div>

<h3>Program I2C scanner</h3>
<p style="margin:0 0 8px;color:var(--mute);font-size:14px">Jalankan ini lebih dulu setiap kali memakai modul I2C untuk memastikan alamatnya (BMP280 0x76/0x77, MPU 0x68/0x69, BH1750 0x23, DS3231 0x68 + EEPROM 0x57).</p>
<div class="codewrap"><div class="cbar"><span>i2c_scanner.ino</span><button class="btn pri" id="cpyScan" type="button">Salin kode</button></div><pre class="c">${esc(SCAN)}</pre></div>

<h3>Tips praktikum</h3>
<div class="g2"><div class="box"><ul class="lst"><li>Rata-ratakan 10–50 sampel analogRead untuk menekan noise; untuk sinyal AC hitung RMS, bukan rata-rata.</li><li>Ukur tegangan 5 V sebenarnya dengan multimeter. Tegangan USB sering 4,7–4,9 V, sehingga semua konversi tegangan bergeser.</li><li>Pisahkan catu motor/relay dari catu sensor; satukan hanya GND.</li></ul></div>
<div class="box"><ul class="lst"><li>Jangan pakai <code>delay()</code> panjang bila ada interrupt atau banyak sensor; pakai pola <code>millis()</code>.</li><li>Variabel yang diubah di ISR harus <code>volatile</code> dan dibaca dengan <code>noInterrupts()</code>.</li><li>Catat hasil kalibrasi (titik, nilai acuan, alat acuan) di laporan praktikum.</li></ul></div></div>
</div>`}
const SCAN=`#include <Wire.h>

void setup() {
  Serial.begin(9600);
  Wire.begin();
  Serial.println("Memindai bus I2C...");
  int n = 0;
  for (uint8_t a = 1; a < 127; a++) {
    Wire.beginTransmission(a);
    if (Wire.endTransmission() == 0) {
      Serial.print("Perangkat ditemukan di 0x");
      if (a < 16) Serial.print('0');
      Serial.println(a, HEX);
      n++;
    }
  }
  Serial.print(n); Serial.println(" perangkat.");
}

void loop() {}`;
function bindDasar(){const i=$('#adcIn');if(!i)return;const up=()=>{const v=+i.value,r=+$('#adcRef').value,a=Math.max(0,Math.min(1023,Math.round(v/r*1023)));$('#adcV').textContent=v.toFixed(3)+' V';
  $('#adcOut').innerHTML=`<tr><td>Nilai ADC</td><td>${a}${v>r?' (jenuh)':''}</td></tr><tr><td>Biner</td><td>${a.toString(2).padStart(10,'0')}</td></tr><tr><td>Resolusi</td><td>${(r/1023*1000).toFixed(2)} mV/langkah</td></tr><tr><td>Tegangan hasil kuantisasi</td><td>${(a*r/1023).toFixed(4)} V</td></tr><tr><td>Error kuantisasi</td><td>${((a*r/1023-Math.min(v,r))*1000).toFixed(2)} mV</td></tr>`};
  i.oninput=up;$('#adcRef').onchange=up;up();$('#cpyScan').onclick=()=>copy(SCAN,$('#cpyScan'))}
